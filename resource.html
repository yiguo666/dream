<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
    <title>Dream · 资源大厅</title>

    <link rel="stylesheet" href="assets/base.css" />

    <link rel="stylesheet" href="assets/detail.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">

    <style>

        :root {
            --brand-blue: #4A90E2;
            --brand-blue-bright: #5BA0F5;
            --brand-blue-dark: #2D6BA8;
            --bg-start: #F8FAFF;
            --bg-end: #F0F5FF;

            --glass-bg: rgba(255, 255, 255, 0.78);
            --glass-bg-hover: rgba(255, 255, 255, 0.90);
            --glass-border: rgba(255, 255, 255, 0.85);
            --shadow-blue: rgba(31, 38, 135, 0.10);
            --shadow-hover: rgba(31, 38, 135, 0.16);
            --transition-smooth: cubic-bezier(0.22, 1, 0.36, 1);
            --radius: 20px;
            --radius-sm: 12px;
            --font-serif: 'Noto Serif SC', serif;
            --font-sans: 'Noto Sans SC', -apple-system, 'PingFang SC', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html {
            scroll-behavior: smooth;

            overflow-x: hidden;
        }

        body {
            font-family: var(--font-sans);
            background: linear-gradient(145deg, var(--bg-start) 0%, var(--bg-end) 100%);
            color: #1A2A4A;
            scroll-behavior: smooth;
            line-height: 1.6;
            min-height: 100vh;
        }

        .main-container {
            max-width: 1240px;
            margin: 24px auto;
            padding: 0 20px 40px;
            display: flex;
            gap: 24px;
            flex: 1;
            width: 100%;
        }

        .sidebar-wrapper {
            width: 220px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            flex-shrink: 0;
            position: sticky;
            top: 80px;
            align-self: flex-start;
        }

        .sidebar {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: var(--radius-sm);
            padding: 16px;
            border: 1px solid var(--glass-border);
            box-shadow: 0 4px 24px var(--shadow-blue);
            transition: all 0.3s var(--transition-smooth);
        }
        .sidebar:hover {
            box-shadow: 0 8px 36px var(--shadow-hover);
            border-color: rgba(74, 144, 226, 0.15);
        }

        .sidebar-title {
            font-size: 0.7rem;
            font-weight: 700;
            color: var(--brand-blue);
            padding: 0 4px 12px;
            border-bottom: 2px solid rgba(74, 144, 226, 0.06);
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .category-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .category-item {
            padding: 9px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.88rem;
            color: #5A6A8A;
            font-weight: 500;
            transition: all 0.25s;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .category-item:hover {
            background: rgba(74, 144, 226, 0.06);
            color: var(--brand-blue);
        }
        .category-item.active {
            background: var(--brand-blue);
            color: #fff;
            font-weight: 600;
            box-shadow: 0 4px 12px rgba(74, 144, 226, 0.25);
        }
        .category-item.all-cat {
            border-bottom: 1px solid rgba(74,144,226,0.1);
            margin-bottom: 6px;
        }

        .sidebar-notice-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: var(--radius-sm);
            padding: 16px;
            border: 1px solid var(--glass-border);
            box-shadow: 0 4px 24px var(--shadow-blue);
            transition: all 0.3s var(--transition-smooth);
        }
        .sidebar-notice-panel:hover {
            box-shadow: 0 8px 36px var(--shadow-hover);
            border-color: rgba(74, 144, 226, 0.15);
        }

        .notice-sub-title {
            font-size: 0.7rem;
            font-weight: 700;
            color: var(--brand-blue);
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .notice-carousel {
            position: relative;
            overflow: hidden;
            min-height: 50px;
        }
        .notice-slide {
            display: none;
            animation: fadeSlide 0.5s ease forwards;
            font-size: 0.82rem;
            color: #475569;
            line-height: 1.6;
            background: rgba(74, 144, 226, 0.04);
            padding: 10px 14px;
            border-radius: 8px;
            border-left: 3px solid var(--brand-blue);
            word-break: break-word;
            cursor: pointer;
            transition: background 0.2s;
        }
        .notice-slide.active {
            display: block;
        }
        .notice-slide:hover {
            background: rgba(74, 144, 226, 0.08);
        }
        @keyframes fadeSlide {
            0% { opacity: 0; transform: translateY(6px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .notice-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-top: 10px;
            padding-top: 8px;
            border-top: 1px solid rgba(74, 144, 226, 0.06);
        }
        .notice-controls.hidden {
            display: none;
        }
        .notice-arrow {
            background: none;
            border: none;
            font-size: 0.9rem;
            color: #94A3B8;
            cursor: pointer;
            padding: 0 4px;
            transition: color 0.2s;
        }
        .notice-arrow:hover {
            color: var(--brand-blue);
        }
        .notice-dots {
            display: flex;
            gap: 5px;
            align-items: center;
        }
        .notice-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #DCE4EC;
            border: none;
            padding: 0;
            cursor: pointer;
            transition: background 0.2s, transform 0.2s;
        }
        .notice-dot.active {
            background: var(--brand-blue);
            transform: scale(1.2);
        }

        .recommend-zone {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: var(--radius-sm);
            padding: 16px;
            border: 1px solid var(--glass-border);
            box-shadow: 0 4px 24px var(--shadow-blue);
            transition: all 0.3s var(--transition-smooth);
        }
        .recommend-zone:hover {
            box-shadow: 0 8px 36px var(--shadow-hover);
            border-color: rgba(74, 144, 226, 0.15);
        }

        .recommend-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .recommend-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.82rem;
            color: #5A6A8A;
            padding: 7px 10px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 8px;
            border: 1px solid rgba(74, 144, 226, 0.04);
            transition: 0.2s;
        }
        .recommend-item:hover {
            border-color: rgba(74, 144, 226, 0.12);
            background: rgba(74, 144, 226, 0.04);
        }
        .recommend-item a {
            color: var(--brand-blue);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.72rem;
            padding: 2px 10px;
            border-radius: 20px;
            background: rgba(74, 144, 226, 0.06);
            transition: 0.2s;
        }
        .recommend-item a:hover {
            background: var(--brand-blue);
            color: #fff;
        }

        .content-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 16px;
            min-width: 0;
        }

        .control-bar {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 12px 18px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--glass-border);
            box-shadow: 0 4px 24px var(--shadow-blue);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            scroll-margin-top: 20px;
            transition: all 0.3s var(--transition-smooth);
        }
        .control-bar:hover {
            box-shadow: 0 8px 36px var(--shadow-hover);
            border-color: rgba(74, 144, 226, 0.15);
        }
        .control-bar h2 {
            font-size: 0.95rem;
            color: #1A2A4A;
            font-weight: 700;
            white-space: nowrap;
        }
        .control-bar h2 span {
            color: var(--brand-blue);
        }

        .search-box-wrapper {
            position: relative;
            flex-grow: 1;
            max-width: 280px;
        }
        .search-input {
            width: 100%;
            padding: 7px 12px 7px 34px;
            font-size: 0.82rem;
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(74, 144, 226, 0.12);
            border-radius: 30px;
            outline: none;
            transition: all 0.3s;
        }
        .search-input:focus {
            background: rgba(255, 255, 255, 0.9);
            border-color: var(--brand-blue);
        }
        .search-icon {
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            width: 14px;
            height: 14px;
            color: #94A3B8;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(155px, 1fr));
            gap: 16px;
        }

        .item-link-wrapper {
            display: block;
            text-decoration: none;
            color: inherit;
            background: var(--glass-bg);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-radius: var(--radius-sm);
            overflow: hidden;
            transition: all 0.4s var(--transition-smooth);
            border: 1px solid var(--glass-border);
            box-shadow: 0 4px 20px var(--shadow-blue);
        }
        .item-link-wrapper:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 40px var(--shadow-hover);
            border-color: rgba(74, 144, 226, 0.2);
        }

        .item {
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .item-image-wrapper {
            width: 100%;
            aspect-ratio: 1 / 1;
            background: rgba(248, 250, 252, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            border-bottom: 1px solid rgba(74, 144, 226, 0.04);
            overflow: hidden;
        }
        .item-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .item-content {
            padding: 10px 10px 12px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex: 1;
        }
        .item-title-row {
            display: flex;
            align-items: baseline;
            gap: 4px;
            min-height: 2.2em;
        }
        .item-zodiac {
            font-size: 0.7rem;
            color: #8A9AA8;
            opacity: 0.6;
            line-height: 1;
            flex-shrink: 0;
        }
        .item-title {
            font-size: 0.82rem;
            font-weight: 600;
            color: #1A2A4A;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            line-height: 1.4;
        }

        .item-meta-line {
            display: flex;
            align-items: center;
            font-size: 0.68rem;
            color: #8A9AA8;
            line-height: 1.3;
            min-width: 0;
        }

        .skeleton-card {
            background: var(--glass-bg);
            backdrop-filter: blur(4px);
            border-radius: var(--radius-sm);
            overflow: hidden;
            border: 1px solid var(--glass-border);
            display: flex;
            flex-direction: column;
        }
        .skeleton-img {
            width: 100%;
            aspect-ratio: 1/1;
            background: linear-gradient(90deg, rgba(200, 215, 230, 0.15) 25%, rgba(220, 235, 248, 0.25) 50%, rgba(200, 215, 230, 0.15) 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }
        .skeleton-body {
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .skeleton-line {
            height: 12px;
            border-radius: 6px;
            background: linear-gradient(90deg, rgba(200, 215, 230, 0.15) 25%, rgba(220, 235, 248, 0.25) 50%, rgba(200, 215, 230, 0.15) 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }
        .skeleton-line--short {
            width: 60%;
        }
        .skeleton-line--btn {
            height: 24px;
            border-radius: 30px;
            margin-top: 2px;
        }
        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        .pagination-bar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 16px 28px;
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 12px 24px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--glass-border);
            box-shadow: 0 4px 24px var(--shadow-blue);
            margin-top: 4px;
            transition: all 0.3s var(--transition-smooth);
        }
        .pagination-bar:hover {
            box-shadow: 0 8px 36px var(--shadow-hover);
            border-color: rgba(74, 144, 226, 0.15);
        }

        .pagination-group {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .pagination-group--jump {
            gap: 6px;
        }

        .page-btn {
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(74, 144, 226, 0.1);
            border-radius: 30px;
            padding: 4px 16px;
            font-size: 0.82rem;
            cursor: pointer;
            transition: all 0.2s;
            color: #4A5A7A;
            font-weight: 500;
        }
        .page-btn:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.8);
            border-color: var(--brand-blue);
            color: var(--brand-blue);
        }
        .page-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            pointer-events: none;
        }

        #pageInfo {
            font-weight: 600;
            color: #1A2A4A;
            font-size: 0.88rem;
            white-space: nowrap;
            padding: 0 4px;
        }

        .page-jump {
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .page-jump span {
            font-size: 0.8rem;
            color: #64748B;
        }
        .page-jump input {
            width: 48px;
            padding: 3px 4px;
            border: 1px solid rgba(74, 144, 226, 0.12);
            border-radius: 30px;
            text-align: center;
            font-size: 0.8rem;
            background: rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(4px);
            outline: none;
        }
        .page-jump input:focus {
            border-color: var(--brand-blue);
            background: rgba(255, 255, 255, 0.8);
        }
        .page-jump button {
            padding: 3px 12px;
            background: linear-gradient(135deg, var(--brand-blue), var(--brand-blue-bright));
            color: #fff;
            border: none;
            border-radius: 30px;
            font-size: 0.72rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .page-jump button:hover {
            transform: scale(1.02);
            box-shadow: 0 4px 12px rgba(74, 144, 226, 0.25);
        }

        .mobile-recommend {
            display: none;
        }
        .mobile-recommend .recommend-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .mobile-recommend .recommend-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.82rem;
            color: #5A6A8A;
            padding: 8px 12px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 8px;
            border: 1px solid rgba(74, 144, 226, 0.04);
        }
        .mobile-recommend .recommend-item a {
            color: var(--brand-blue);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.72rem;
            padding: 2px 10px;
            border-radius: 20px;
            background: rgba(74, 144, 226, 0.06);
        }
        .mobile-recommend .recommend-item a:hover {
            background: var(--brand-blue);
            color: #fff;
        }

        .content-notice-panel {
            display: none;
        }

        @media (max-width: 1024px) {
            .sidebar-wrapper {
                width: 190px;
            }
            .grid-container {
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
                gap: 12px;
            }
        }

        @media (max-width: 768px) {
            .main-container {
                flex-direction: column;
                padding: 12px 12px 30px;
                gap: 14px;
            }

            .sidebar-wrapper {
                width: 100%;
                flex-direction: row;
                flex-wrap: wrap;
                gap: 10px;
                position: static;
                top: auto;
                align-self: auto;
            }
            .sidebar-wrapper>.sidebar {
                flex: 1;
                min-width: 100%;
                padding: 12px 14px 8px;
            }

            .category-list {
                display: flex;
                overflow-x: auto;
                gap: 8px;
                padding: 4px 0 8px;
                scrollbar-width: none;
                flex-direction: row;
            }
            .category-list::-webkit-scrollbar {
                display: none;
            }
            .category-item {
                flex-shrink: 0;
                margin-bottom: 0;
                padding: 10px 18px;
                background: rgba(74, 144, 226, 0.04);
                border-radius: 30px;
                font-size: 0.82rem;
                font-weight: 500;
                white-space: nowrap;
            }
            .category-item.active {
                background: var(--brand-blue);
                color: #fff;
            }
            .category-item.all-cat {
                border-bottom: none;
                margin-bottom: 0;
            }

            .sidebar-notice-panel {
                display: none !important;
            }
            .recommend-zone {
                display: none !important;
            }

            .content-notice-panel {
                display: block !important;
                background: var(--glass-bg);
                backdrop-filter: blur(12px);
                -webkit-backdrop-filter: blur(12px);
                border-radius: var(--radius-sm);
                padding: 14px 16px;
                border: 1px solid var(--glass-border);
                box-shadow: 0 4px 24px var(--shadow-blue);
                transition: all 0.3s var(--transition-smooth);
            }
            .content-notice-panel:hover {
                box-shadow: 0 8px 36px var(--shadow-hover);
                border-color: rgba(74, 144, 226, 0.15);
            }
            .content-notice-panel .notice-carousel {
                min-height: 44px;
            }
            .content-notice-panel .notice-slide {
                font-size: 0.8rem;
                padding: 8px 12px;
            }
            .content-notice-panel .notice-controls {
                margin-top: 6px;
                padding-top: 6px;
            }

            .mobile-recommend {
                display: block !important;
                background: var(--glass-bg);
                backdrop-filter: blur(12px);
                -webkit-backdrop-filter: blur(12px);
                border-radius: var(--radius-sm);
                padding: 14px 16px;
                border: 1px solid var(--glass-border);
                box-shadow: 0 4px 24px var(--shadow-blue);
                transition: all 0.3s var(--transition-smooth);
            }
            .mobile-recommend:hover {
                box-shadow: 0 8px 36px var(--shadow-hover);
                border-color: rgba(74, 144, 226, 0.15);
            }
            .mobile-recommend .notice-sub-title {
                margin-bottom: 8px;
            }

            .grid-container {
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
            }
            .item-link-wrapper {
                border-radius: 10px;
            }
            .item-content {
                padding: 8px;
            }
            .item-title {
                font-size: 0.78rem;
            }

            .control-bar {
                flex-direction: column;
                align-items: stretch;
                gap: 10px;
                padding: 12px 14px;
            }
            .control-bar h2 {
                font-size: 0.85rem;
                white-space: normal;
                text-align: center;
            }
            .search-box-wrapper {
                max-width: 100%;
            }

            .pagination-bar {
                flex-direction: column;
                align-items: stretch;
                gap: 8px;
                padding: 10px 14px;
            }
            .pagination-group:first-child {
                display: flex;
                justify-content: center;
                align-items: center;
                gap: 6px;
                flex-wrap: nowrap;
                width: 100%;
            }
            #pageInfo {
                font-size: 0.8rem;
            }
            #prevPageBtn,
            #nextPageBtn {
                padding: 3px 12px;
                font-size: 0.75rem;
            }
            .pagination-group--jump {
                width: 100%;
                justify-content: center;
                gap: 4px;
            }
            .pagination-group--jump input {
                width: 42px;
                font-size: 0.72rem;
            }
            .pagination-group--jump button {
                font-size: 0.68rem;
                padding: 3px 10px;
            }

        }

        @media (max-width: 480px) {
            .grid-container {
                gap: 8px;
            }
            .item-content {
                padding: 6px;
            }
            .item-title {
                font-size: 0.7rem;
            }
            .item-zodiac {
                font-size: 0.6rem;
            }

            .pagination-bar {
                padding: 8px 10px;
            }
            #pageInfo {
                font-size: 0.7rem;
            }
            #prevPageBtn,
            #nextPageBtn {
                padding: 2px 8px;
                font-size: 0.65rem;
            }
            .pagination-group--jump input {
                width: 36px;
                font-size: 0.65rem;
            }
            .pagination-group--jump button {
                font-size: 0.6rem;
                padding: 2px 6px;
            }

            .sidebar-wrapper>.sidebar {
                padding: 10px 12px 6px;
            }
            .category-item {
                padding: 8px 14px;
                font-size: 0.76rem;
            }
        }

        .main-container {
            margin: 0 auto;
            padding: 0 20px 40px;
        }

        .dg-rail {
            padding: var(--space-6) 0 var(--space-8);
            margin-bottom: 4px;
            border-bottom: 1px solid rgba(74, 144, 226, 0.13);
        }

        .dg-rail__head {
            display: flex;
            align-items: center;
            gap: var(--space-3) var(--space-5);
            flex-wrap: wrap;
            margin-bottom: var(--space-4);
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 10px 14px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--glass-border);
            box-shadow: 0 4px 24px var(--shadow-blue);
        }

        .dg-rail .category-list {
            flex-direction: row;
            flex-wrap: wrap;
            gap: 6px 2px;
        }

        .dg-rail .category-item {
            padding: 5px 14px;
            border-radius: var(--radius-pill);
            font-size: 0.84rem;
            color: #5A6A8A;
            background: transparent;
            transition: background 0.25s, color 0.25s;
        }

        .dg-rail .category-item:hover {
            background: rgba(74, 144, 226, 0.06);
            color: var(--brand-blue);
        }

        .dg-rail .category-item.active {
            background: var(--brand-blue);
            color: #fff;
            box-shadow: none;
        }

        .dg-rail .category-item.all-cat {
            border-bottom: none;
            margin-bottom: 0;
            font-weight: 700;
        }

        @media (max-width: 768px) {
            .dg-rail {
                padding: var(--space-5) 0 var(--space-6);
            }
            .dg-rail .category-list {
                flex-wrap: nowrap;
                overflow-x: auto;
            }
        }
    </style>
    <script src="softwares.js"></script>
</head>
<body class="product-theme" data-accent="blue">

    <nav class="dw-nav">
        <a href="index.html" class="dw-nav__brand">Dream <small>主页世界</small></a>
        <div class="dw-nav__links">
            <a href="index.html">名片</a>
            <a href="origin.html">原创工坊</a>
            <a href="resource.html" class="active">资源大厅</a>
        </div>
    </nav>

    <div class="dw-container dw-container--wide">

        <header class="dg-head">
            <div class="dg-head__eyebrow">
                <span class="yr">DREAM</span>
                <span>资源大厅 · ARCHIVE</span>
            </div>
            <h1 class="dg-head__title">值得留下的<em>小工具</em></h1>
        </header>

        <section class="dg-rail">
            <div class="dg-rail__head">
                <ul class="category-list" id="categoryUl"></ul>
            </div>
        </section>

    </div>

    <div class="main-container">

        <div class="sidebar-wrapper">

            <div class="sidebar-notice-panel" id="noticePanelDesktop">
                <div class="notice-sub-title">📢 大厅动态</div>
                <div class="notice-carousel" id="noticeCarouselDesktop"></div>
                <div class="notice-controls" id="noticeControlsDesktop">
                    <button class="notice-arrow" id="noticePrevDesktop">◀</button>
                    <span class="notice-dots" id="noticeDotsDesktop"></span>
                    <button class="notice-arrow" id="noticeNextDesktop">▶</button>
                </div>
            </div>

            <div id="recommendZone" class="recommend-zone">
                <div class="notice-sub-title">⭐ 精品推荐</div>
                <ul id="recommendList" class="recommend-list"></ul>
            </div>
        </div>

        <div class="content-panel">

            <div class="control-bar" id="controlBar">
                <h2>当前视图：<span id="currentCategoryTitle">🏠 全部资源</span></h2>
                <div class="search-box-wrapper">
                    <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                    <input type="text" id="searchInput" class="search-input" placeholder="检索资源...">
                </div>
            </div>

            <div class="grid-container" id="productGrid">
            </div>

            <div class="pagination-bar" id="paginationBar">
                <div class="pagination-group">
                    <button class="page-btn" id="prevPageBtn">◀ 上一页</button>
                    <span id="pageInfo">第 1 / 1 页</span>
                    <button class="page-btn" id="nextPageBtn">下一页 ▶</button>
                </div>
                <div class="pagination-group pagination-group--jump">
                    <span>跳转</span>
                    <input type="number" id="pageJumpInput" min="1" placeholder="页">
                    <button id="pageJumpBtn">GO</button>
                </div>
            </div>

            <div class="content-notice-panel" id="noticePanelMobile">
                <div class="notice-sub-title">📢 大厅动态</div>
                <div class="notice-carousel" id="noticeCarouselMobile"></div>
                <div class="notice-controls" id="noticeControlsMobile">
                    <button class="notice-arrow" id="noticePrevMobile">◀</button>
                    <span class="notice-dots" id="noticeDotsMobile"></span>
                    <button class="notice-arrow" id="noticeNextMobile">▶</button>
                </div>
            </div>

            <div id="mobileRecommend" class="mobile-recommend">
                <div class="notice-sub-title">⭐ 精品推荐</div>
                <ul id="mobileRecommendList" class="recommend-list"></ul>
            </div>

        </div>

    </div>

    <footer class="dw-footer">
        <div class="friends" id="friendLinks"><span class="friends__label">友情链接</span></div>
        <p class="dw-footer__cr">&copy; 2026 Designed by <strong>Dream</strong>. All Rights Reserved. &nbsp;|&nbsp; <a href="#">回到顶部</a></p>
    </footer>

    <script>
        (function() {
            'use strict';
            let allProducts = [];
            let categories = ["全部资源"];
            let currentCategory = "全部资源";
            let searchKeyword = "";
            const PAGE_SIZE = 20;
            let currentPage = 0;
            const ZODIAC = ['🐭', '🐮', '🐯', '🐰', '🐲', '🐍', '🐴', '🐏', '🐵', '🐔', '🐶', '🐷'];
            let searchTimer = null;

            const categoryUl = document.getElementById('categoryUl');
            const productGrid = document.getElementById('productGrid');
            const searchInput = document.getElementById('searchInput');
            const prevPageBtn = document.getElementById('prevPageBtn');
            const nextPageBtn = document.getElementById('nextPageBtn');
            const pageInfo = document.getElementById('pageInfo');
            const pageJumpBtn = document.getElementById('pageJumpBtn');
            const pageJumpInput = document.getElementById('pageJumpInput');
            const currentCategoryTitle = document.getElementById('currentCategoryTitle');

            function getStateFromUrl() {
                const params = new URLSearchParams(window.location.search);
                const cat = params.get('category') || "全部资源";
                const page = parseInt(params.get('page'), 10) || 1;
                const search = params.get('search') || "";
                return { category: cat, page: page - 1, search: search };
            }

            function updateUrlParams(pushState) {
                const params = new URLSearchParams();
                if (currentCategory && currentCategory !== "全部资源") {
                    params.set('category', currentCategory);
                }
                if (currentPage > 0) {
                    params.set('page', currentPage + 1);
                }
                if (searchKeyword) {
                    params.set('search', searchKeyword);
                }
                const newUrl = window.location.pathname + (params.toString() ? '?' + params.toString() : '');
                if (pushState !== false) {
                    history.pushState({ category: currentCategory, page: currentPage, search: searchKeyword }, '', newUrl);
                } else {
                    history.replaceState({ category: currentCategory, page: currentPage, search: searchKeyword }, '', newUrl);
                }
            }

            function loadStateFromUrl() {
                const state = getStateFromUrl();
                currentCategory = state.category;
                currentPage = state.page;
                searchKeyword = state.search;
                searchInput.value = searchKeyword;
                renderCategories();
                updateCategoryUI(currentCategory);
                renderProductGrid();
                updateUrlParams(false);
            }

            window.addEventListener('popstate', function(e) {
                if (e.state) {
                    currentCategory = e.state.category || "全部资源";
                    currentPage = e.state.page || 0;
                    searchKeyword = e.state.search || "";
                    searchInput.value = searchKeyword;
                    renderCategories();
                    updateCategoryUI(currentCategory);
                    renderProductGrid();
                } else {
                    loadStateFromUrl();
                }
            });

            function initNoticeBoard(config) {
                const {
                    containerId,
                    carouselId,
                    dotsId,
                    prevId,
                    nextId,
                    interval = 5000
                } = config;

                const container = document.getElementById(containerId);
                if (!container) return null;

                const carousel = document.getElementById(carouselId);
                const dotsContainer = document.getElementById(dotsId);
                const prevBtn = document.getElementById(prevId);
                const nextBtn = document.getElementById(nextId);

                if (!carousel || !dotsContainer || !prevBtn || !nextBtn) return null;

                let list = [];
                if (typeof ALL_SOFTWARES !== 'undefined' && ALL_SOFTWARES.announcements && ALL_SOFTWARES.announcements.length > 0) {
                    list = ALL_SOFTWARES.announcements.filter(ann => ann.title && ann.title.trim() !== '');
                }

                carousel.innerHTML = '';
                dotsContainer.innerHTML = '';

                if (list.length === 0) {
                    container.style.display = 'none';
                    return null;
                }

                let currentIndex = 0;
                let timer = null;

                list.forEach((ann, idx) => {
                    const slide = document.createElement('div');
                    slide.className = 'notice-slide' + (idx === 0 ? ' active' : '');
                    slide.textContent = ann.title;
                    slide.dataset.targetUrl = ann.targetUrl || '';
                    slide.dataset.index = idx;
                    slide.addEventListener('click', function(e) {
                        const url = this.dataset.targetUrl;
                        if (url && url.trim() !== '') {
                            window.open(url, '_blank');
                        }
                    });
                    carousel.appendChild(slide);

                    const dot = document.createElement('button');
                    dot.className = 'notice-dot' + (idx === 0 ? ' active' : '');
                    dot.dataset.index = idx;
                    dot.setAttribute('aria-label', '切换到公告 ' + (idx + 1));
                    dotsContainer.appendChild(dot);
                });

                const controls = container.querySelector('.notice-controls');
                if (controls) {
                    if (list.length <= 1) {
                        controls.classList.add('hidden');
                    } else {
                        controls.classList.remove('hidden');
                    }
                }

                function goTo(index) {
                    if (list.length === 0) return;
                    if (index < 0) index = list.length - 1;
                    if (index >= list.length) index = 0;
                    if (index === currentIndex) return;
                    currentIndex = index;

                    const slides = carousel.querySelectorAll('.notice-slide');
                    const dots = dotsContainer.querySelectorAll('.notice-dot');
                    slides.forEach((s, i) => { s.classList.toggle('active', i === currentIndex); });
                    dots.forEach((d, i) => { d.classList.toggle('active', i === currentIndex); });
                }

                function next() { goTo(currentIndex + 1); }
                function prev() { goTo(currentIndex - 1); }

                function startAuto() {
                    if (list.length <= 1) return;
                    if (timer) clearInterval(timer);
                    timer = setInterval(next, interval);
                }
                function stopAuto() { if (timer) { clearInterval(timer); timer = null; } }
                function resetAuto() { stopAuto(); startAuto(); }

                prevBtn.addEventListener('click', () => { prev(); resetAuto(); });
                nextBtn.addEventListener('click', () => { next(); resetAuto(); });

                dotsContainer.querySelectorAll('.notice-dot').forEach(dot => {
                    dot.addEventListener('click', function() {
                        const idx = parseInt(this.dataset.index, 10);
                        if (!isNaN(idx) && idx !== currentIndex) {
                            goTo(idx);
                            resetAuto();
                        }
                    });
                });

                container.addEventListener('mouseenter', stopAuto);
                container.addEventListener('mouseleave', startAuto);
                container.addEventListener('touchstart', stopAuto, { passive: true });
                container.addEventListener('touchend', startAuto, { passive: true });

                startAuto();

                return { goTo, next, prev, startAuto, stopAuto, resetAuto, getCurrentIndex: () => currentIndex, getList: () => list };
            }

            function renderCategories() {
                categoryUl.innerHTML = '';
                const allItem = document.createElement('li');
                allItem.className = 'category-item all-cat' + (currentCategory === "全部资源" ? ' active' : '');
                allItem.textContent = '🏠 全部资源';
                allItem.dataset.cat = '全部资源';
                allItem.addEventListener('click', function() {
                    currentCategory = '全部资源';
                    currentPage = 0;
                    searchKeyword = '';
                    searchInput.value = '';
                    renderCategories();
                    updateCategoryUI(currentCategory);
                    renderProductGrid();
                    updateUrlParams(true);
                });
                categoryUl.appendChild(allItem);
                categories.forEach(function(cat) {
                    if (cat === "全部资源") return;
                    const li = document.createElement('li');
                    li.className = 'category-item' + (cat === currentCategory ? ' active' : '');
                    li.textContent = cat;
                    li.dataset.cat = cat;
                    li.addEventListener('click', function() {
                        currentCategory = cat;
                        currentPage = 0;
                        searchKeyword = '';
                        searchInput.value = '';
                        renderCategories();
                        updateCategoryUI(currentCategory);
                        renderProductGrid();
                        updateUrlParams(true);
                    });
                    categoryUl.appendChild(li);
                });
            }

            function updateCategoryUI(cat) {
                currentCategoryTitle.innerText = cat;
                document.querySelectorAll('.category-item').forEach(function(item) {
                    item.classList.toggle('active', item.dataset.cat === cat);
                });
            }

            function loadData() {
                if (typeof ALL_SOFTWARES === 'undefined' || !ALL_SOFTWARES.products) {
                    productGrid.innerHTML = '<div style="grid-column:1/-1;text-align:center;color:#EF4444;padding:40px;">⚠️ 数据加载失败，请检查 softwares.js 文件。</div>';
                    return false;
                }
                allProducts = ALL_SOFTWARES.products.filter(function (p) {
                    return p.category !== '🎯 原创工具';
                });

                if (ALL_SOFTWARES.categories && Array.isArray(ALL_SOFTWARES.categories) && ALL_SOFTWARES.categories.length > 0) {
                    categories = ['全部资源'].concat(ALL_SOFTWARES.categories.filter(function (c) {
                        return c !== '🎯 原创工具';
                    }));
                } else {
                    const catSet = new Set();
                    allProducts.forEach(p => { if (p.category) catSet.add(p.category); });
                    categories = ['全部资源'].concat(Array.from(catSet));
                }

                loadRecommendations();
                loadFriendLinks();

                initNoticeBoard({
                    containerId: 'noticePanelDesktop',
                    carouselId: 'noticeCarouselDesktop',
                    dotsId: 'noticeDotsDesktop',
                    prevId: 'noticePrevDesktop',
                    nextId: 'noticeNextDesktop',
                    interval: 5000
                });
                initNoticeBoard({
                    containerId: 'noticePanelMobile',
                    carouselId: 'noticeCarouselMobile',
                    dotsId: 'noticeDotsMobile',
                    prevId: 'noticePrevMobile',
                    nextId: 'noticeNextMobile',
                    interval: 5000
                });

                return true;
            }

            function loadRecommendations() {
                const sideList = document.getElementById('recommendList');

                const recommends = ALL_SOFTWARES.products.filter(p => p.isRecommend === true && p.category !== '🎯 原创工具');
                if (recommends.length === 0) {
                    document.getElementById('recommendZone').style.display = 'none';
                    document.getElementById('mobileRecommend').style.display = 'none';
                    return;
                }
                document.getElementById('recommendZone').style.display = 'block';
                let sideHtml = '';
                recommends.forEach(function(rec) {
                    let detailUrl, targetAttr = '';
                    if (rec.detailPageType === "自定义模板" && rec.detailPagePath) {
                        detailUrl = rec.detailPagePath;
                        targetAttr = ' target="_blank"';
                    } else {
                        detailUrl = 'tail.html?id=' + rec.id;
                    }
                    sideHtml += '<li class="recommend-item">' +
                        '<span>' + rec.name + '</span>' +
                        '<a href="' + detailUrl + '"' + targetAttr + '>查看</a>' +
                        '</li>';
                });
                sideList.innerHTML = sideHtml;

                const mobileList = document.getElementById('mobileRecommendList');
                if (mobileList) mobileList.innerHTML = sideHtml;
            }

            function loadFriendLinks() {
                const box = document.getElementById('friendLinks');
                if (!box) { return; }
                const list = (typeof ALL_SOFTWARES !== 'undefined' && ALL_SOFTWARES.friendLinks)
                    ? ALL_SOFTWARES.friendLinks.filter(function (f) {
                        return f.siteName && f.jumpUrl
                            && f.jumpUrl.trim() !== '' && f.jumpUrl !== 'http://';
                    }) : [];
                if (!list.length) { box.style.display = 'none'; return; }
                box.insertAdjacentHTML('beforeend', list.map(function (f) {
                    return '<a href="' + f.jumpUrl + '" target="_blank" rel="noopener">'
                         + (f.siteName || '友链') + '</a>';
                }).join(''));
            }

            function getFilteredCount() {
                let filtered = allProducts.slice();
                if (currentCategory !== "全部资源") {
                    filtered = filtered.filter(function(p) { return p.category === currentCategory; });
                }
                if (searchKeyword !== "") {
                    filtered = filtered.filter(function(p) { return p.name.toLowerCase().includes(searchKeyword); });
                }
                return filtered.length;
            }

            function renderProductGrid() {
                let filtered = allProducts.slice();
                if (currentCategory !== "全部资源") {
                    filtered = filtered.filter(function(p) { return p.category === currentCategory; });
                }
                if (searchKeyword !== "") {
                    filtered = filtered.filter(function(p) { return p.name.toLowerCase().includes(searchKeyword); });
                }

                const total = filtered.length;
                const totalPages = Math.ceil(total / PAGE_SIZE);
                if (currentPage >= totalPages && totalPages > 0) { currentPage = totalPages - 1; }
                if (currentPage < 0) currentPage = 0;

                const start = currentPage * PAGE_SIZE;
                const end = Math.min(start + PAGE_SIZE, total);
                const pageItems = filtered.slice(start, end);

                const grid = document.getElementById('productGrid');
                if (pageItems.length === 0) {
                    grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;color:#94A3B8;padding:40px;">💡 未检索到符合条件的资源。</div>';
                    updatePagination(total, totalPages);
                    updateUrlParams(true);
                    return;
                }

                let html = '';
                pageItems.forEach(function(product) {
                    const globalIndex = filtered.indexOf(product);
                    const zodiac = ZODIAC[globalIndex % 12];
                    const logo = product.mainImage && product.mainImage.trim() !== '' ? product.mainImage : 'logo/default.png';
                    let detailUrl, targetAttr = '';
                    if (product.detailPageType === "自定义模板" && product.detailPagePath) {
                        detailUrl = product.detailPagePath;
                        targetAttr = ' target="_blank"';
                    } else {
                        detailUrl = 'tail.html?id=' + product.id;
                    }
                    html += '<a href="' + detailUrl + '"' + targetAttr + ' class="item-link-wrapper">' +
                        '<div class="item">' +
                        '<div class="item-image-wrapper">' +
                        '<img src="' + logo + '" alt="' + product.name + '" class="item-image" onerror="this.onerror=null; this.src=\'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22155%22 height=%22155%22%3E%3Crect fill=%22%234A90E2%22 width=%22155%22 height=%22155%22/%3E%3Ctext x=%2277.5%22 y=%2290%22 text-anchor=%22middle%22 fill=%22white%22 font-size=%2260%22 font-family=%22sans-serif%22%3E?%3C/text%3E%3C/svg%3E\';">' +
                        '</div>' +
                        '<div class="item-content">' +
                        '<div class="item-title-row">' +
                        '<span class="item-zodiac">' + zodiac + '</span>' +
                        '<span class="item-title" title="' + product.name + '">' + product.name + '</span>' +
                        '</div>' +
                        '<div class="item-meta-line">' +
                        '<span class="m-size">📦 ' + (product.size ? product.size : '—') + '</span>' +
                        '</div>' +
                        '</div>' +
                        '</div>' +
                        '</a>';
                });
                grid.innerHTML = html;
                updatePagination(total, totalPages);
                updateUrlParams(true);
            }

            function updatePagination(total, totalPages) {
                if (total === 0) {
                    pageInfo.textContent = '第 0 / 0 页';
                    prevPageBtn.disabled = true;
                    nextPageBtn.disabled = true;
                    return;
                }
                const currentDisplay = currentPage + 1;
                pageInfo.textContent = '第 ' + currentDisplay + ' / ' + totalPages + ' 页';
                prevPageBtn.disabled = (currentPage === 0);
                nextPageBtn.disabled = (currentPage >= totalPages - 1);
                pageJumpInput.max = totalPages;
                pageJumpInput.placeholder = '1-' + totalPages;
            }

            function handleSearchInput() {
                clearTimeout(searchTimer);
                searchTimer = setTimeout(function() {
                    const val = searchInput.value.trim().toLowerCase();
                    if (val !== searchKeyword) {
                        searchKeyword = val;
                        currentPage = 0;
                        renderProductGrid();
                    }
                }, 300);
            }

            function scrollToControlBar() {
                const controlBar = document.getElementById('controlBar');
                if (!controlBar) return;
                const rect = controlBar.getBoundingClientRect();
                const topOffset = 70;
                const targetY = rect.top + window.pageYOffset - topOffset;
                window.scrollTo({ top: targetY, behavior: 'smooth' });
            }

            document.addEventListener('DOMContentLoaded', function() {
                if (!loadData()) return;

                loadStateFromUrl();

                searchInput.addEventListener('input', handleSearchInput);

                prevPageBtn.addEventListener('click', function() {
                    if (currentPage > 0) { currentPage--; renderProductGrid(); scrollToControlBar(); }
                });
                nextPageBtn.addEventListener('click', function() {
                    const total = getFilteredCount();
                    const totalPages = Math.ceil(total / PAGE_SIZE);
                    if (currentPage < totalPages - 1) { currentPage++; renderProductGrid(); scrollToControlBar(); }
                });
                pageJumpBtn.addEventListener('click', function() {
                    let val = parseInt(pageJumpInput.value.trim(), 10);
                    const total = getFilteredCount();
                    const totalPages = Math.ceil(total / PAGE_SIZE);
                    if (isNaN(val) || val < 1) val = 1;
                    if (val > totalPages) val = totalPages;
                    if (val >= 1 && val <= totalPages) {
                        currentPage = val - 1;
                        renderProductGrid();
                        scrollToControlBar();
                    }
                    pageJumpInput.value = '';
                });
                pageJumpInput.addEventListener('keydown', function(e) {
                    if (e.key === 'Enter') { pageJumpBtn.click(); }
                });

                window.addEventListener('resize', handleMobileRecommend);
                handleMobileRecommend();

                renderCategories();
                updateCategoryUI(currentCategory);
                renderProductGrid();
            });

            function handleMobileRecommend() {
                const isMobile = window.innerWidth <= 768;
                const zone = document.getElementById('recommendZone');
                const mobileZone = document.getElementById('mobileRecommend');
                if (!zone || !mobileZone) return;

                if (isMobile) {
                    zone.style.display = 'none';
                    mobileZone.style.display = 'block';
                    const sideList = document.getElementById('recommendList');
                    const mobileList = document.getElementById('mobileRecommendList');
                    if (sideList && mobileList) {
                        mobileList.innerHTML = sideList.innerHTML;
                    }
                } else {
                    zone.style.display = 'block';
                    mobileZone.style.display = 'none';
                }
            }

        })();
    </script>

</body>
