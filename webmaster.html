<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>关于 Dream - 站长个人主页</title>
    <style>
        /* 1. 物理层级优化：全面兼容移动端动态视口 */
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #f4f7fc; /* 微蓝灰底 */
            position: relative;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            display: flex;
            flex-direction: column; /* 纵向排列：头-中-尾 */
            position: relative;
            z-index: 1;
            overflow-x: hidden;
            overflow-y: auto; /* 移动端允许整页有物理弹性滚动，防止小屏设备完全堵死 */
            transition: background-color 0.8s ease-out;
        }

        /* 2. 头部 */
        header {
            background-color: #1e293b; /* 雅黑色 */
            color: #fff;
            text-align: center;
            padding: 3vh 0; /* 缩窄，给移动端卡片留出更多垂直空间 */
            flex-shrink: 0;
            border-bottom: 3px solid #0069f3;
        }

        header h1 {
            color: #ffffff;
            margin: 0;
            font-size: 1.6rem;
            letter-spacing: 4px;
            text-transform: uppercase;
        }
        header h1 span {
            color: #0069f3;
        }

        /* 3. 中间主体 */
        main {
            flex: 1; 
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px; /* 缩小间距适应小屏 */
            box-sizing: border-box;
        }

        section {
            width: 100%;
            max-width: 650px;
            padding: 25px 20px; /* 稍微内缩，防止小屏幕两侧太挤 */
            background-color: #fff;
            box-shadow: 0 15px 35px rgba(0, 105, 243, 0.04), 0 5px 15px rgba(0,0,0,0.02);
            border-radius: 16px;
            text-align: center;
            border: 1px solid rgba(0, 105, 243, 0.08);
            box-sizing: border-box;
            transition: all 1.2s cubic-bezier(0.22, 1, 0.36, 1);
        }

        /* PC端专属悬浮效果，移动端自动忽略 */
        @media (min-width: 768px) {
            section:hover {
                transform: translateY(-5px);
                box-shadow: 0 20px 50px rgba(0, 105, 243, 0.08);
            }
        }

        /* 头像 */
        .profile-img {
            border-radius: 50%;
            width: 95px; /* 稍微压缩尺寸适应移动端屏高 */
            height: 95px;
            margin: 0 auto 12px;
            display: block;
            border: 4px solid #0069f3;
            background-color: #fff;
            transition: transform 2.5s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 1s ease;
            cursor: pointer;
        }

        .profile-img:hover {
            transform: rotate(360deg);
            box-shadow: 0 0 20px 8px rgba(0, 105, 243, 0.15);
        }

        h2 { color: #0f172a; margin-bottom: 10px; font-size: 1.3rem; font-weight: 700; }
        p { line-height: 1.6; color: #334155; margin: 6px 0; font-size: 0.92rem; }
        .highlight { color: #0069f3; font-weight: 600; }

        /* 【核心重构：黑客帝国动态控制台】 */
        .status-terminal {
            background: #0d1117; 
            border: 1px solid #30363d;
            border-radius: 10px;
            padding: 12px;
            margin: 15px 0;
            text-align: left;
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 0.8rem; /* 稍微降低字体避免移动端单行溢出换行 */
            color: #58a6ff; 
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
            transition: all 0.5s ease;
        }

        .status-terminal.warning-active {
            border-color: #ff3366;
            box-shadow: 0 0 25px rgba(255, 51, 102, 0.35), inset 0 0 15px rgba(255, 51, 102, 0.2);
            animation: terminalShake 0.4s ease-in-out 3;
        }

        @keyframes terminalShake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-3px); }
            40%, 80% { transform: translateX(3px); }
        }

        /* 背景画布 */
        #matrix-canvas {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0.12; 
            pointer-events: none;
            z-index: 0;
        }

        .terminal-content {
            position: relative;
            z-index: 1; 
            min-height: 95px;
            display: flex;
            flex-direction: column;
        }

        .command-line {
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            visibility: hidden; 
        }

        .command-line.typing::after {
            content: '█';
            animation: blink 0.6s infinite;
            margin-left: 4px;
        }

        @keyframes blink {
            0%, 100% { opacity: 0; }
            50% { opacity: 1; }
        }

        .text-alert {
            color: #ff3366 !important;
            font-weight: bold;
            text-shadow: 0 0 8px #ff3366;
        }

        .text-mission {
            color: #34d399 !important;
            text-shadow: 0 0 6px rgba(52, 211, 153, 0.4);
        }

        .social-icons {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid #f1f5f9;
        }

        .social-icons a {
            display: inline-block;
            margin: 0 15px;
            color: #64748b;
            font-weight: 600;
            font-size: 0.85rem;
            text-decoration: none;
            position: relative;
        }

        /* 4. 底部动作区域优化 */
        .action-area {
            margin-top: 15px;
            padding-top: 5px;
            position: relative;
            min-height: 48px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .action-area a {
            transition: opacity 0.6s ease, transform 0.6s ease;
        }

        .action-area.hide-normal a {
            opacity: 0;
            pointer-events: none;
            transform: scale(0.8);
        }

        button {
            padding: 12px 45px;
            font-size: 0.88rem;
            font-weight: bold;
            background-color: #0069f3;
            color: #fff;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 6px 16px rgba(0, 105, 243, 0.15);
            transition: all 1s cubic-bezier(0.22, 1, 0.36, 1);
            -webkit-tap-highlight-color: transparent; /* 清除移动端点击高亮蓝块 */
        }

        /* 传送门包装层 */
        .portal-wrapper {
            position: absolute;
            top: 0;
            opacity: 0;
            transform: scale(0.7);
            transition: all 1.2s cubic-bezier(0.34, 1.56, 0.64, 1);
            display: none;
            width: 100%;
            text-align: center;
        }

        .portal-wrapper.show {
            display: block;
            opacity: 1;
            transform: scale(1);
        }

        .portal-btn {
            background: radial-gradient(circle, #001530 0%, #0d1117 70%) !important;
            color: #00bcff !important;
            border: 2px dashed #00bcff !important;
            box-shadow: 0 0 20px rgba(0, 188, 255, 0.3) !important;
            letter-spacing: 2px;
            overflow: hidden;
            position: relative;
            display: inline-block;
        }

        .portal-btn::before {
            content: '';
            position: absolute;
            top: -50%; left: -50%; width: 200%; height: 200%;
            border: 2px dotted #34d399;
            border-radius: 46%;
            animation: rotatePortal 4s linear infinite;
            pointer-events: none;
            opacity: 0.5;
        }

        .portal-btn::after {
            content: '';
            position: absolute;
            top: -40%; left: -40%; width: 180%; height: 180%;
            border: 1px dashed #ff00ff;
            border-radius: 42%;
            animation: rotatePortalInverse 6s linear infinite;
            pointer-events: none;
            opacity: 0.3;
        }

        @keyframes rotatePortal {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        @keyframes rotatePortalInverse {
            from { transform: rotate(360deg); }
            to { transform: rotate(0deg); }
        }

        /* 页面入场动画 */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .fade-in {
            animation: fadeIn 1.5s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }
    </style>
</head>
<body>

    <header>
        <h1>Dream <span>//</span> Space</h1>
    </header>

    <main>
        <section class="fade-in" id="main-card">
            <img src="picture/dlam.png" alt="Dream" class="profile-img">
            
            <h2>你好，我是 <span class="highlight">Dream</span></h2>
            
            <p>基于兴趣与直觉构建的空间，是我的第四维度。</p>
            <p>在这里，不去定义身份，只沉淀值得被固化的灵感。</p>
            <p>在 <span class="highlight">畅享工坊</span> 计划中,不定期共享绿色纯净自制轻量工具给大家。</p>

            <div class="status-terminal" id="terminal">
                <canvas id="matrix-canvas"></canvas>
                
                <div class="terminal-content" id="display-box">
                    <div class="command-line" data-text="> Initialize Identity... Done."></div>
                    <div class="command-line" data-text="> OS Environment: Dream space 10 [x64]"></div>
                    <div class="command-line" data-text="> Mission: Create a New World & Technological Tools"></div>
                    <div class="command-line" data-text="> Status: Core Engine is running smoothly..."></div>
                </div>
            </div>

            <div class="social-icons">
                <a href="https://space.bilibili.com/2027317299" target="_blank">BiliBili 空间</a>
                <a href="#" onclick="alert('摄影画廊还在整理中，敬请期待！'); return false;">500PX 画廊</a>
            </div>

            <div class="action-area" id="control-zone">
                <a href="index.html" style="text-decoration: none;">
                    <button>返回主页世界</button>
                </a>
                <div class="portal-wrapper" id="portal-zone">
                    <button class="portal-btn" onclick="executeWarp()">激活隐秘传送门 // WARP</button>
                </div>
            </div>
        </section>
    </main>

    <script>
        // --- 1. 代码雨画布尺寸自适应控制 ---
        const canvas = document.getElementById('matrix-canvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            // 使用getBoundingClientRect确保精确获取移动端实时渲染尺寸
            const rect = canvas.parentElement.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;
        }
        
        // 延迟执行初次尺寸计算，防止移动端未加载完导致的画布0大小问题
        setTimeout(resizeCanvas, 100);
        window.addEventListener('resize', resizeCanvas);

        const alphabet = "010101ABCDEFGHIJKLMNOPQRSTUVWXYZ<>//$$*-%#".split("");
        const fontSize = 12; // 移动端稍微收缩字号
        let columns = Math.floor(window.innerWidth / fontSize);
        let rainDrops = Array(columns > 0 ? columns : 50).fill(1);
        let currentRainColor = '#58a6ff'; 

        function drawMatrix() {
            ctx.fillStyle = 'rgba(13, 17, 23, 0.08)'; 
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = currentRainColor; 
            ctx.font = fontSize + 'px monospace';

            for (let i = 0; i < rainDrops.length; i++) {
                const text = alphabet[Math.floor(Math.random() * alphabet.length)];
                ctx.fillText(text, i * fontSize, rainDrops[i] * fontSize);

                if (rainDrops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    rainDrops[i] = 0;
                }
                rainDrops[i]++;
            }
        }
        let matrixInterval = setInterval(drawMatrix, 40);


        // --- 2. 动态逐行打字机逻辑驱动 ---
        const displayBox = document.getElementById('display-box');
        const terminal = document.getElementById('terminal');
        const controlZone = document.getElementById('control-zone');
        const portalZone = document.getElementById('portal-zone');
        
        let lines = Array.from(displayBox.querySelectorAll('.command-line'));
        let currentLineIndex = 0;

        function typeLine(elements, callback) {
            if (currentLineIndex >= elements.length) {
                if (callback) callback();
                return;
            }

            const line = elements[currentLineIndex];
            const fullText = line.getAttribute('data-text');
            line.style.visibility = 'visible';
            line.classList.add('typing');

            let currentCharIndex = 0;
            line.innerText = '';

            const timer = setInterval(() => {
                if (currentCharIndex < fullText.length) {
                    line.innerText += fullText.charAt(currentCharIndex);
                    currentCharIndex++;
                } else {
                    clearInterval(timer);
                    line.classList.remove('typing'); 
                    currentLineIndex++;
                    setTimeout(() => typeLine(elements, callback), 250);
                }
            }, 30);
        }

        // 页面缓冲完毕后正式开启
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                typeLine(lines, () => {
                    startSecretTimeline();
                });
            }, 400);
        });


        // --- 3. 隐藏神秘传送门触发时间轴 ---
        function startSecretTimeline() {
            // 【阶段二：威胁警告】
            setTimeout(() => {
                terminal.classList.add('warning-active');
                currentRainColor = '#ff3366'; 
                
                injectInstantLine("> [CRITICAL] ANOMALOUS OVERFLOW DETECTED.", "text-alert");
                injectInstantLine("> [WARNING] SPATIAL LAYER BREACH IN PROGRESS...", "text-alert");
            }, 6000);

            // 【阶段三：急速灌注】
            setTimeout(() => {
                currentRainColor = '#00bcff'; 
                canvas.style.opacity = "0.35"; 
                
                let loadCount = 0;
                let fastLoadTimer = setInterval(() => {
                    const injectionCodes = [
                        `> Injecting: Sockets.Connecting_To(Fourth_Dimension)...`,
                        `> Compiling: NoteEngine.Sync.Optimizer.ExtractDelta() -> 100%`,
                        `> Buffer: Allocating quantum portal structure stack [0x7FFF]`,
                        `> Handshake: Gateway verification successfully passed.`,
                        `> Info: Initializing wormhole anchor link configuration...`
                    ];
                    injectInstantLine(injectionCodes[loadCount % injectionCodes.length]);
                    loadCount++;
                    
                    if (loadCount >= 5) {
                        clearInterval(fastLoadTimer);
                        triggerMissionPhase(); 
                    }
                }, 400);
            }, 9500);
        }

        // 【阶段四：发布任务指令】
        function triggerMissionPhase() {
            canvas.style.opacity = "0.05"; 
            currentRainColor = '#34d399';  
            
            const allLines = displayBox.querySelectorAll('.command-line');
            for(let i=0; i < allLines.length - 2; i++) {
                allLines[i].remove();
            }

            const m1 = createDelayLine("> [MISSION]: 发现一条通往未知维度的奇点时空隧道。", "text-mission");
            const m2 = createDelayLine("> [ACTION]: 点击下方粒子漩涡核执行次元跃迁。", "text-mission");
            
            currentLineIndex = 0;
            typeLine([m1, m2], () => {
                // 【阶段五：传送门激活】
                setTimeout(() => {
                    controlZone.classList.add('hide-normal'); 
                    portalZone.classList.add('show');          
                    injectInstantLine("> Status: Portal Gateway stabilized. Ready for warp.");
                }, 500);
            });
        }

        // DOM 操纵小工具
        function injectInstantLine(text, customClass = '') {
            const div = document.createElement('div');
            div.className = `command-line ${customClass}`;
            div.style.visibility = 'visible';
            div.innerText = text;
            displayBox.appendChild(div);
            autoScrollTrim();
        }

        function createDelayLine(text, customClass = '') {
            const div = document.createElement('div');
            div.className = `command-line ${customClass}`;
            div.setAttribute('data-text', text);
            displayBox.appendChild(div);
            autoScrollTrim();
            return div;
        }

        function autoScrollTrim() {
            const currentLines = displayBox.querySelectorAll('.command-line');
            if (currentLines.length > 4) {
                currentLines[0].remove(); 
            }
        }

        // 次元扭曲坍塌跳转
        function executeWarp() {
            const mainCard = document.getElementById('main-card');
            mainCard.style.transform = "scale(0.01) rotate(1080deg)";
            mainCard.style.opacity = "0";
            document.body.style.backgroundColor = "#ffffff";
            
            setTimeout(() => {
                window.location.href = "index.html"; 
            }, 900);
        }
    </script>
</body>
</html>
