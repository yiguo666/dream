<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
    <title>关于 Dream · 站长个人主页</title>
    <style>
        :root {
            --brand-blue: #4A90E2;
            --brand-blue-bright: #5BA0F5;
            --brand-blue-light: #7BB8F5;
            --brand-blue-dark: #2D6BA8;
            --bg-start: #F8FAFF;
            --bg-end: #F0F5FF;
            --glass-bg: rgba(255, 255, 255, 0.75);
            --glass-border: rgba(74, 144, 226, 0.10);
            --shadow-blue: rgba(74, 144, 226, 0.06);
            --shadow-hover: rgba(74, 144, 226, 0.14);
            --transition-smooth: cubic-bezier(0.22, 1, 0.36, 1);
            --radius: 20px;
            --radius-sm: 12px;
            --glow-hue: 210;
            --glow-color: rgba(74, 144, 226, 0.55);
            --glow-soft: rgba(74, 144, 226, 0.18);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, 'Noto Sans SC', 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(145deg, var(--bg-start) 0%, var(--bg-end) 100%);
            color: #1A2A4A;
            overflow-x: hidden;
            scroll-behavior: smooth;
            line-height: 1.6;
            min-height: 100vh;
            transition: background 0.8s cubic-bezier(0.22, 1, 0.36, 1);
        }

        #particle-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .navbar {
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            background: rgba(255, 255, 255, 0.72);
            border-bottom: 1px solid rgba(74, 144, 226, 0.08);
            padding: 10px 24px;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            flex-wrap: wrap;
            gap: 10px 24px;
        }

        .navbar .logo {
            font-size: 1.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--brand-blue), var(--brand-blue-bright));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-decoration: none;
            flex-shrink: 0;
        }

        .navbar .logo small {
            font-size: 0.8rem;
            font-weight: 400;
            -webkit-text-fill-color: #5A6A8A;
            color: #5A6A8A;
            background: none;
        }

        .nav-links {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            align-items: center;
        }

        .nav-links a {
            color: #4A5A7A;
            text-decoration: none;
            padding: 6px 14px;
            font-size: 0.85rem;
            font-weight: 600;
            border-radius: 30px;
            transition: all 0.3s ease;
        }

        .nav-links a:hover {
            color: var(--brand-blue);
            background: rgba(74, 144, 226, 0.06);
        }

        .nav-links a.active {
            color: var(--brand-blue);
            background: rgba(74, 144, 226, 0.08);
        }

        .container {
            max-width: 820px;
            margin: 0 auto;
            padding: 30px 20px 20px;
            position: relative;
            z-index: 1;
        }

        .card {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: var(--radius);
            border: 1px solid var(--glass-border);
            box-shadow: 0 4px 24px var(--shadow-blue);
            padding: 28px 32px;
            transition: all 0.4s var(--transition-smooth);
        }

        .card:hover {
            box-shadow: 0 8px 36px var(--shadow-hover);
            border-color: rgba(74, 144, 226, 0.15);
        }

        .profile-section {
            text-align: center;
            position: relative;
        }

        .profile-section .avatar {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            margin: 0 auto 14px;
            display: block;
            border: 3px solid rgba(74, 144, 226, 0.15);
            box-shadow: 0 4px 20px rgba(74, 144, 226, 0.10);
            object-fit: cover;
            transition: 0.3s;
        }

        .profile-section .avatar:hover {
            transform: scale(1.04);
            border-color: var(--brand-blue);
        }

        .profile-section .name {
            font-size: 1.5rem;
            font-weight: 700;
            color: #1A2A4A;
        }

        .profile-section .bio {
            font-size: 0.95rem;
            color: #5A6A8A;
            margin: 2px 0 6px;
            line-height: 1.7;
        }

        .profile-section .desc {
            font-size: 0.9rem;
            color: #475569;
            line-height: 1.8;
            max-width: 500px;
            margin: 0 auto;
        }

        .profile-section .desc .highlight {
            color: var(--brand-blue);
            font-weight: 600;
        }

        .social-row {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin: 14px 0 6px;
        }

        .social-row a {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(74, 144, 226, 0.06);
            color: #4A5A7A;
            text-decoration: none;
            transition: all 0.3s ease;
            font-size: 1.1rem;
            cursor: pointer;
            border: none;
        }

        .social-row a:hover {
            background: var(--brand-blue);
            color: #fff;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(74, 144, 226, 0.25);
        }

        .glimmer-wrapper {
            position: relative;
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid rgba(74, 144, 226, 0.06);
            overflow: hidden;
            min-height: 200px;
        }

        .glimmer-particles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
            overflow: hidden;
        }

        .glimmer-particle {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
            will-change: transform, opacity;
            transition: none;
        }

        .glimmer-particle::after {
            content: '';
            display: block;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: var(--glow-color);
            box-shadow: 0 0 12px 6px var(--glow-soft);
            animation: dotShimmer 3s ease-in-out infinite;
        }

        @keyframes dotShimmer {
            0%,100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 0.8; transform: scale(2.2); }
        }

        .glimmer-inner {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .glimmer-label {
            font-size: 0.65rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--brand-blue);
            font-weight: 700;
            padding: 2px 12px;
            border-radius: 20px;
            background: rgba(74, 144, 226, 0.04);
            width: fit-content;
            margin: 0 auto;
        }

        .glimmer-text-area {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 60px;
            cursor: pointer;
            padding: 4px 0;
            position: relative;
            z-index: 3;
        }

        .glimmer-text {
            font-size: 1.05rem;
            line-height: 1.9;
            color: #0f172a;
            font-weight: 500;
            letter-spacing: 0.6px;
            transition: opacity 0.45s ease, transform 0.45s ease;
            opacity: 1;
            transform: translateY(0);
            text-align: center;
            pointer-events: none;
            text-shadow: 0 1px 4px rgba(255,255,255,0.3);
        }
        .glimmer-text.fading {
            opacity: 0;
            transform: translateY(-8px);
        }

        .glimmer-meta {
            font-size: 0.75rem;
            color: #94a3b8;
            letter-spacing: 0.3px;
            pointer-events: none;
            margin-bottom: 2px;
            position: relative;
            z-index: 3;
        }
        .glimmer-meta .meta-year { color: #4A90E2; font-weight: 600; }

        .envelope-card {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 44px;
            width: 100%;
            margin-top: 2px;
            z-index: 3;
        }

        .envelope-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 22px;
            border-radius: 30px;
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(74, 144, 226, 0.12);
            color: #4A90E2;
            font-size: 0.85rem;
            font-weight: 500;
            letter-spacing: 0.8px;
            cursor: pointer;
            transition: all 0.5s cubic-bezier(0.22, 1, 0.36, 1);
            box-shadow: 0 2px 8px rgba(74, 144, 226, 0.04);
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        .envelope-btn:hover {
            background: rgba(255, 255, 255, 0.7);
            border-color: rgba(74, 144, 226, 0.3);
            box-shadow: 0 4px 16px rgba(74, 144, 226, 0.08);
        }
        .envelope-btn:active { transform: scale(0.96); }
        .envelope-icon { font-size: 1.1rem; flex-shrink: 0; }

        .text-slot {
            position: relative;
            display: inline-block;
            width: 140px;
            height: 1.4em;
            text-align: center;
        }
        .envelope-text, .fortune-display {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            white-space: nowrap;
            transition: opacity 0.4s ease;
        }
        .envelope-text {
            opacity: 1;
            font-weight: 600;
            font-size: 0.85rem;
        }
        .fortune-display {
            opacity: 0;
            pointer-events: none;
            font-family: 'Georgia', 'Noto Sans SC', serif;
            font-size: 0.85rem;
            letter-spacing: 0.5px;
            color: #4A90E2;
            background: rgba(74, 144, 226, 0.06);
            padding: 2px 12px;
            border-radius: 14px;
            border: 1px solid rgba(74, 144, 226, 0.1);
            font-weight: 500;
        }
        .envelope-btn.revealed .envelope-text { opacity: 0; pointer-events: none; }
        .envelope-btn.revealed .fortune-display { opacity: 1; pointer-events: auto; }

        .console-card {
            margin-top: 20px;
            position: relative;
            z-index: 1;
        }

        .status-terminal {
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 10px;
            padding: 12px 16px;
            text-align: left;
            font-family: Consolas, 'Courier New', monospace;
            font-size: .88rem;
            color: #58a6ff;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 0 10px rgba(0,0,0,.8);
            transition: all .5s ease;
            height: 180px;
            min-height: 180px;
            max-height: 180px;
        }
        .status-terminal.warning-active {
            border-color: #ff3366;
            box-shadow: 0 0 25px rgba(255,51,102,.35), inset 0 0 15px rgba(255,51,102,.2);
            animation: terminalShake .4s ease-in-out 3;
        }
        @keyframes terminalShake {
            0%,100% { transform: translateX(0); }
            20%,60% { transform: translateX(-3px); }
            40%,80% { transform: translateX(3px); }
        }

        #matrix-canvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            opacity: 0.12;
            pointer-events: none;
            z-index: 0;
        }

        .terminal-content {
            position: relative;
            z-index: 1;
            height: 100%;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            justify-content: flex-start;
        }

        .command-line {
            margin-bottom: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            visibility: hidden;
            width: 100%;
            display: block;
            flex-shrink: 0;
            line-height: 1.4;
            font-size: inherit;
        }
        .command-line.typing::after {
            content: '█';
            animation: blink .6s infinite;
            margin-left: 4px;
        }
        @keyframes blink { 0%,100% { opacity: 0; } 50% { opacity: 1; } }

        .text-alert { color: #ff3366 !important; font-weight: 700; text-shadow: 0 0 8px #ff3366; }
        .text-mission { color: #34d399 !important; text-shadow: 0 0 6px rgba(52,211,153,.4); }

        .console-action {
            margin-top: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            min-height: 56px;
            position: relative;
        }

        .btn-container {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            min-height: 56px;
        }

        .btn-primary {
            padding: 12px 50px;
            font-size: .92rem;
            font-weight: 700;
            background: #4A90E2;
            color: #fff;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 6px 16px rgba(74,144,226,.2);
            transition: all .8s cubic-bezier(.22,1,.36,1);
            -webkit-tap-highlight-color: transparent;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: auto;
            min-width: 220px;
            text-align: center;
            z-index: 2;
            opacity: 1;
            pointer-events: auto;
        }
        .btn-primary:hover { background: #357ABD; transform: translate(-50%, -50%) scale(1.02); }
        .btn-primary.hidden {
            opacity: 0;
            pointer-events: none;
            transform: translate(-50%, -50%) scale(0.8);
        }

        .portal-btn {
            background: radial-gradient(circle, #001530 0%, #0d1117 70%) !important;
            color: #00bcff !important;
            border: 2px dashed #00bcff !important;
            box-shadow: 0 0 30px rgba(0,188,255,.2) !important;
            letter-spacing: 2px;
            overflow: hidden;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.8);
            padding: 12px 50px;
            font-size: .92rem;
            font-weight: 700;
            border-radius: 30px;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            min-width: 220px;
            text-align: center;
            z-index: 1;
            opacity: 0;
            pointer-events: none;
            transition: all 1.2s cubic-bezier(.34,1.56,.64,1);
        }
        .portal-btn.show {
            opacity: 1;
            pointer-events: auto;
            transform: translate(-50%, -50%) scale(1);
            z-index: 3;
        }
        .portal-btn::before {
            content: '';
            position: absolute;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            border: 2px dotted #34d399;
            border-radius: 46%;
            animation: rotatePortal 4s linear infinite;
            pointer-events: none;
            opacity: .5;
        }
        .portal-btn::after {
            content: '';
            position: absolute;
            top: -40%; left: -40%;
            width: 180%; height: 180%;
            border: 1px dashed #ff00ff;
            border-radius: 42%;
            animation: rotatePortalInverse 6s linear infinite;
            pointer-events: none;
            opacity: .3;
        }
        @keyframes rotatePortal { from { transform: rotate(0); } to { transform: rotate(360deg); } }
        @keyframes rotatePortalInverse { from { transform: rotate(360deg); } to { transform: rotate(0); } }

        .warp-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 9999;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }
        .warp-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .warp-overlay .bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at center, #0a1628 0%, #000000 100%);
            z-index: 0;
        }

        .warp-overlay .warp-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .warp-overlay .warp-text {
            position: relative;
            z-index: 2;
            color: #00bcff;
            font-family: 'Courier New', monospace;
            font-size: 1.2rem;
            letter-spacing: 4px;
            text-shadow: 0 0 30px rgba(0,188,255,0.3);
            animation: warpTextPulse 0.8s ease-in-out infinite alternate;
            margin-top: 20px;
            opacity: 0;
            transition: opacity 0.6s ease;
        }
        .warp-overlay.active .warp-text {
            opacity: 1;
        }

        @keyframes warpTextPulse {
            0% { opacity: 0.4; text-shadow: 0 0 20px rgba(0,188,255,0.2); }
            100% { opacity: 1; text-shadow: 0 0 60px rgba(0,188,255,0.6); }
        }

        .warp-overlay .warp-spinner {
            position: relative;
            z-index: 2;
            width: 80px;
            height: 80px;
            border: 3px solid rgba(0,188,255,0.1);
            border-top: 3px solid #00bcff;
            border-radius: 50%;
            animation: warpSpin 1.2s cubic-bezier(0.22, 1, 0.36, 1) infinite;
            box-shadow: 0 0 60px rgba(0,188,255,0.15);
            opacity: 0;
            transition: opacity 0.6s ease;
        }
        .warp-overlay.active .warp-spinner {
            opacity: 1;
        }

        @keyframes warpSpin {
            0% { transform: rotate(0deg) scale(0.8); }
            100% { transform: rotate(720deg) scale(1.2); }
        }

        .warp-overlay .warp-ring {
            position: absolute;
            border-radius: 50%;
            border: 1px solid rgba(0,188,255,0.08);
            z-index: 1;
            animation: warpRingExpand 1.8s ease-out infinite;
        }
        .warp-ring.r1 { width: 200px; height: 200px; animation-delay: 0s; }
        .warp-ring.r2 { width: 400px; height: 400px; animation-delay: 0.3s; }
        .warp-ring.r3 { width: 600px; height: 600px; animation-delay: 0.6s; }

        @keyframes warpRingExpand {
            0% { transform: scale(0.3); opacity: 0.8; }
            100% { transform: scale(1.5); opacity: 0; }
        }

        .footer {
            text-align: center;
            padding: 24px 20px 20px;
            color: #8A9AB0;
            font-size: 0.8rem;
            border-top: 1px solid rgba(74, 144, 226, 0.06);
            margin-top: 10px;
        }

        .footer a {
            color: var(--brand-blue);
            text-decoration: none;
        }
        .footer a:hover {
            color: var(--brand-blue-dark);
        }

        .friend-links-zone {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            padding: 0 0 10px;
            font-size: 0.78rem;
            color: #64748b;
        }
        .friend-link-node {
            color: #64748b;
            text-decoration: none;
            transition: 0.2s;
        }
        .friend-link-node:hover {
            color: #4A90E2;
        }

        @media (max-width: 768px) {
            .navbar { padding: 8px 16px; gap: 6px 16px; }
            .nav-links a { padding: 4px 10px; font-size: 0.75rem; }
            .container { padding: 20px 16px 16px; }
            .card { padding: 20px 18px; }
            .profile-section .avatar { width: 80px; height: 80px; }
            .profile-section .name { font-size: 1.2rem; }
            .profile-section .desc { font-size: 0.85rem; }
            .glimmer-text { font-size: 0.92rem; line-height: 1.7; }
            .envelope-btn { padding: 6px 16px; font-size: 0.8rem; }
            .text-slot { width: 120px; }
            .fortune-display { font-size: 0.78rem; padding: 2px 10px; }
            .btn-primary, .portal-btn {
                padding: 10px 34px;
                font-size: .85rem;
                min-width: 180px;
            }
            .status-terminal {
                height: auto;
                min-height: 150px;
                max-height: none;
                font-size: .72rem;
                padding: 10px 12px;
            }
            .terminal-content {
                height: auto;
                overflow-y: visible;
            }
            .command-line {
                white-space: normal;
                overflow: visible;
                text-overflow: clip;
                line-height: 1.5;
                margin-bottom: 4px;
            }
            .social-row a { width: 36px; height: 36px; font-size: 1rem; }
            .warp-overlay .warp-text { font-size: 0.9rem; }
            .warp-overlay .warp-spinner { width: 60px; height: 60px; }
            .warp-ring.r1 { width: 150px; height: 150px; }
            .warp-ring.r2 { width: 280px; height: 280px; }
            .warp-ring.r3 { width: 400px; height: 400px; }
        }

        @media (max-width: 400px) {
            .glimmer-text { font-size: 0.82rem; line-height: 1.6; }
            .envelope-btn { padding: 5px 12px; font-size: 0.72rem; }
            .text-slot { width: 100px; }
            .fortune-display { font-size: 0.7rem; padding: 1px 8px; }
            .btn-primary, .portal-btn {
                padding: 8px 24px;
                font-size: .78rem;
                min-width: 150px;
            }
            .social-row a { width: 32px; height: 32px; font-size: 0.85rem; }
            .warp-overlay .warp-text { font-size: 0.75rem; }
            .warp-overlay .warp-spinner { width: 48px; height: 48px; }
            .warp-ring.r1 { width: 120px; height: 120px; }
            .warp-ring.r2 { width: 200px; height: 200px; }
            .warp-ring.r3 { width: 280px; height: 280px; }
        }
    </style>
</head>
<body>

    <canvas id="particle-bg"></canvas>

    <div class="warp-overlay" id="warpOverlay">
        <div class="bg"></div>
        <div class="warp-ring r1"></div>
        <div class="warp-ring r2"></div>
        <div class="warp-ring r3"></div>
        <canvas class="warp-canvas" id="warpCanvas"></canvas>
        <div class="warp-spinner"></div>
        <div class="warp-text">✦ 次元传送中 ...</div>
    </div>

    <nav class="navbar">
        <a href="#" class="logo">Dream <small>主页世界</small></a>
        <div class="nav-links">
            <a href="index.html">首页</a>
            <a href="#" class="active">关于我</a>
            <a href="shopindex.html">畅享</a>
        </div>
    </nav>

    <div class="container">

        <div class="card">

        (function() {
            'use strict';

            (function initParticles() {
                const canvas = document.getElementById('particle-bg');
                const ctx = canvas.getContext('2d');
                let w, h, particles = [];
                const COUNT = 55;
                const COLORS = ['#4A90E2', '#5BA0F5', '#7BB8F5', '#A0CDF5', '#C4DFF8'];

                function resize() {
                    w = canvas.width = window.innerWidth;
                    h = canvas.height = window.innerHeight;
                }
                window.addEventListener('resize', resize);
                resize();

                class Particle {
                    constructor() { this.reset(); }
                    reset() {
                        this.x = Math.random() * w;
                        this.y = Math.random() * h;
                        this.size = Math.random() * 2.5 + 0.8;
                        this.speedX = (Math.random() - 0.5) * 0.25;
                        this.speedY = (Math.random() - 0.5) * 0.25;
                        this.opacity = Math.random() * 0.3 + 0.06;
                        this.color = COLORS[Math.floor(Math.random() * COLORS.length)];
                    }
                    update() {
                        this.x += this.speedX;
                        this.y += this.speedY;
                        if (this.x < 0 || this.x > w) this.speedX *= -1;
                        if (this.y < 0 || this.y > h) this.speedY *= -1;
                    }
                    draw() {
                        ctx.beginPath();
                        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                        ctx.fillStyle = this.color;
                        ctx.globalAlpha = this.opacity;
                        ctx.fill();
                        ctx.globalAlpha = 1;
                    }
                }
                for (let i = 0; i < COUNT; i++) particles.push(new Particle());

                function drawLines() {
                    for (let i = 0; i < particles.length; i++) {
                        for (let j = i + 1; j < particles.length; j++) {
                            const dx = particles[i].x - particles[j].x;
                            const dy = particles[i].y - particles[j].y;
                            const dist = Math.sqrt(dx * dx + dy * dy);
                            if (dist < 100) {
                                ctx.beginPath();
                                ctx.moveTo(particles[i].x, particles[i].y);
                                ctx.lineTo(particles[j].x, particles[j].y);
                                ctx.strokeStyle = `rgba(74, 144, 226, ${0.04 * (1 - dist / 100)})`;
                                ctx.lineWidth = 0.5;
                                ctx.stroke();
                            }
                        }
                    }
                }

                function animate() {
                    ctx.clearRect(0, 0, w, h);
                    particles.forEach(p => { p.update(); p.draw(); });
                    drawLines();
                    requestAnimationFrame(animate);
                }
                animate();
            })();

            (function initParticles() {
                const container = document.getElementById('glimmerParticles');
                const wrapper = document.getElementById('glimmerWrapper');
                if (!container || !wrapper) return;

                const isMobile = window.innerWidth < 768;
                const count = isMobile ? 8 : 16;

                let particles = [];
                let animId = null;

                function getBounds() {
                    const rect = wrapper.getBoundingClientRect();
                    return { w: rect.width, h: rect.height };
                }

                function createParticle(bounds) {
                    const size = 3 + Math.random() * 5;
                    return {
                        x: Math.random() * bounds.w,
                        y: Math.random() * bounds.h,
                        vx: (Math.random() - 0.5) * 0.6,
                        vy: (Math.random() - 0.5) * 0.6,
                        size: size,
                        opacity: 0.3 + Math.random() * 0.5,
                        el: null
                    };
                }

                function initDOM() {
                    container.innerHTML = '';
                    const bounds = getBounds();
                    particles = [];

                    for (let i = 0; i < count; i++) {
                        const p = createParticle(bounds);
                        const el = document.createElement('span');
                        el.className = 'glimmer-particle';
                        el.style.width = p.size + 'px';
                        el.style.height = p.size + 'px';
                        el.style.left = p.x + 'px';
                        el.style.top = p.y + 'px';
                        el.style.opacity = p.opacity;
                        el.style.animationDelay = (Math.random() * 3) + 's';
                        el.style.setProperty('--particle-size', p.size + 'px');
                        container.appendChild(el);
                        p.el = el;
                        particles.push(p);
                    }
                }

                function updateParticles() {
                    const bounds = getBounds();
                    if (bounds.w === 0 || bounds.h === 0) {
                        animId = requestAnimationFrame(updateParticles);
                        return;
                    }

                    for (let i = 0; i < particles.length; i++) {
                        const p = particles[i];
                        p.vx += (Math.random() - 0.5) * 0.08;
                        p.vy += (Math.random() - 0.5) * 0.08;

                        const maxSpeed = 0.8;
                        const speed = Math.sqrt(p.vx * p.vx + p.vy * p.vy);
                        if (speed > maxSpeed) {
                            p.vx = (p.vx / speed) * maxSpeed;
                            p.vy = (p.vy / speed) * maxSpeed;
                        }

                        p.x += p.vx;
                        p.y += p.vy;

                        const margin = 10;
                        if (p.x < -margin) { p.x = -margin;
                            p.vx = Math.abs(p.vx); }
                        if (p.x > bounds.w + margin) { p.x = bounds.w + margin;
                            p.vx = -Math.abs(p.vx); }
                        if (p.y < -margin) { p.y = -margin;
                            p.vy = Math.abs(p.vy); }
                        if (p.y > bounds.h + margin) { p.y = bounds.h + margin;
                            p.vy = -Math.abs(p.vy); }

                        if (p.el) {
                            p.el.style.left = p.x + 'px';
                            p.el.style.top = p.y + 'px';
                            const breathe = 0.85 + 0.15 * Math.sin(Date.now() / 2000 + i);
                            const baseSize = p.size;
                            p.el.style.width = (baseSize * breathe) + 'px';
                            p.el.style.height = (baseSize * breathe) + 'px';
                        }
                    }

                    animId = requestAnimationFrame(updateParticles);
                }

                let resizeTimer = null;
                window.addEventListener('resize', function() {
                    clearTimeout(resizeTimer);
                    resizeTimer = setTimeout(function() {
                        const bounds = getBounds();
                        for (const p of particles) {
                            p.x = Math.min(Math.max(p.x, 0), bounds.w);
                            p.y = Math.min(Math.max(p.y, 0), bounds.h);
                        }
                    }, 200);
                });

                initDOM();
                updateParticles();

                window.addEventListener('beforeunload', function() {
                    if (animId) cancelAnimationFrame(animId);
                });

                console.log('[光点] 自由飘动粒子已启动，共 ' + count + ' 个');
            })();

                        year: '2019', date: '9.1' },

                const fortunes = [
                    '✨ 静心 · 安然',
                    '🌸 浮生若梦',
                    '🌙 一期一会',
                    '☀️ 行至水穷',
                    '🍃 坐看云起',
                    '🌊 此心安处',
                    '🏔️ 清风徐来',
                    '🌿 海纳百川',
                    '🕊️ 光而不耀',
                    '🌅 静水流深',
                    '🍂 素履以往',
                    '🌱 独行愿也',
                ];

                const glimmerText = document.getElementById('glimmerText');
                const glimmerMeta = document.getElementById('glimmerMeta');
                const clickArea = document.getElementById('glimmerClickArea');
                const envelopeBtn = document.getElementById('envelopeBtn');
                const fortuneDisplay = document.getElementById('fortuneDisplay');

                let currentFortune = fortunes[Math.floor(Math.random() * fortunes.length)];
                fortuneDisplay.textContent = currentFortune;

                const renderShard = (data) => {
                    glimmerText.classList.add('fading');
                    setTimeout(() => {
                        glimmerText.innerHTML = data.text;
                        const title = data.title || '随笔';
                        glimmerMeta.innerHTML = `— ${title} · <span class="meta-year">${data.year}</span> · ${data.date}`;
                        glimmerText.classList.remove('fading');
                    }, 400);
                };

                let playlist = [],
                    currentIndex = 0,
                    lastShard = null,
                    autoTimer = null;

                const shuffle = (arr) => {
                    const a = [...arr];
                    for (let i = a.length - 1; i > 0; i--) {
                        const j = Math.floor(Math.random() * (i + 1));
                        [a[i], a[j]] = [a[j], a[i]];
                    }
                    return a;
                };

                const createPlaylist = (exclude) => {
                    let list = shuffle(shards);
                    if (exclude && list.length > 1 && list[0] === exclude) {
                        for (let i = 1; i < list.length; i++) {
                            if (list[i] !== exclude) {
                                [list[0], list[i]] = [list[i], list[0]];
                                break;
                            }
                        }
                    }
                    return list;
                };

                const nextShard = () => {
                    currentIndex = (currentIndex + 1) % playlist.length;
                    if (currentIndex === 0) {
                        playlist = createPlaylist(lastShard);
                        currentIndex = 0;
                    }
                    return playlist[currentIndex];
                };

                function startAutoPlay() {
                    if (autoTimer) clearInterval(autoTimer);
                    autoTimer = setInterval(() => {
                        const shard = nextShard();
                        renderShard(shard);
                        lastShard = shard;
                    }, 18000);
                }

                function stopAutoPlay() {
                    if (autoTimer) {
                        clearInterval(autoTimer);
                        autoTimer = null;
                    }
                }

                clickArea.addEventListener('click', function(e) {
                    if (e.target.closest('#envelopeBtn')) return;
                    const shard = nextShard();
                    renderShard(shard);
                    lastShard = shard;
                    startAutoPlay();
                });

                let revealed = false;
                envelopeBtn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    if (!revealed) {
                        const newFortune = fortunes[Math.floor(Math.random() * fortunes.length)];
                        fortuneDisplay.textContent = newFortune;
                        revealed = true;
                        envelopeBtn.classList.add('revealed');
                    } else {
                        revealed = false;
                        envelopeBtn.classList.remove('revealed');
                    }
                });

                document.addEventListener('keydown', function(e) {
                    if (e.key === 'Escape' && revealed) {
                        revealed = false;
                        envelopeBtn.classList.remove('revealed');
                    }
                });

                document.addEventListener('visibilitychange', function() {
                    if (document.hidden) {
                        stopAutoPlay();
                    } else {
                        startAutoPlay();
                    }
                });

                playlist = createPlaylist(null);
                currentIndex = 0;
                const first = playlist[0];
                renderShard(first);
                lastShard = first;
                startAutoPlay();

                console.log('[微光碎片] 已启动，共 ' + shards.length + ' 条诗句');
            })();

            (function initConsole() {
                const terminal = document.getElementById('terminal');
                const displayBox = document.getElementById('display-box');
                const btnHome = document.getElementById('btnHome');
                const btnPortal = document.getElementById('btnPortal');
                const warpOverlay = document.getElementById('warpOverlay');
                const warpCanvas = document.getElementById('warpCanvas');

                let currentLineIndex = 0;
                let warpParticles = [];
                let warpAnimId = null;

                function typeLine(elements, callback) {
                    if (currentLineIndex >= elements.length) {
                        if (callback) callback();
                        return;
                    }
                    const line = elements[currentLineIndex];
                    const fullText = line.getAttribute('data-text');
                    if (!fullText) {
                        currentLineIndex++;
                        setTimeout(() => typeLine(elements, callback), 80);
                        return;
                    }
                    line.style.visibility = 'visible';
                    line.classList.add('typing');
                    line.innerText = '';
                    let charIndex = 0;
                    const timer = setInterval(function() {
                        if (charIndex < fullText.length) {
                            line.innerText += fullText.charAt(charIndex);
                            charIndex++;
                        } else {
                            clearInterval(timer);
                            line.classList.remove('typing');
                            currentLineIndex++;
                            setTimeout(() => typeLine(elements, callback), 200);
                        }
                    }, 30);
                }

                function createDelayLine(text, className) {
                    const div = document.createElement('div');
                    div.className = 'command-line' + (className ? ' ' + className : '');
                    div.setAttribute('data-text', text);
                    displayBox.appendChild(div);
                    trimLines(8);
                    return div;
                }

                function trimLines(max) {
                    let lines = displayBox.querySelectorAll('.command-line');
                    while (lines.length > max) {
                        lines[0].remove();
                        lines = displayBox.querySelectorAll('.command-line');
                    }
                }

                const initialTexts = [
                    '> Initialize Identity... Done.',
                    '> OS Environment: Dream space 10 [x64]',
                    '> Mission: Create a New World & Tools',
                    '> Status: Core Engine running smoothly...'
                ];

                displayBox.innerHTML = '';
                const initLines = [];
                initialTexts.forEach(t => initLines.push(createDelayLine(t)));

                currentLineIndex = 0;
                typeLine(initLines, function() {
                    startSecretTimeline();
                });

                function startSecretTimeline() {
                    setTimeout(function() {
                        terminal.classList.add('warning-active');
                        window.setRainColor('#ff3366');

                        const alert1 = createDelayLine('> [CRITICAL] ANOMALOUS OVERFLOW DETECTED.', 'text-alert');
                        const alert2 = createDelayLine('> [WARNING] SPATIAL LAYER BREACH...', 'text-alert');

                        currentLineIndex = 0;
                        typeLine([alert1, alert2], function() {
                            setTimeout(function() {
                                window.setRainColor('#00bcff');
                                const canvas = document.getElementById('matrix-canvas');
                                if (canvas) canvas.style.opacity = '0.35';

                                displayBox.innerHTML = '';

                                const lines = [
                                    '> Injecting: Sockets.Connect(Fourth_Dimension)...',
                                    '> Compiling: NoteEngine.Sync.Optimize() -> 0%',
                                    '> Buffer: Allocating portal stack [0x7FFF]',
                                    '> Handshake: Gateway verification passed.',
                                    '> Info: Initializing wormhole link...'
                                ];

                                const lineElements = [];
                                lines.forEach(text => {
                                    const div = document.createElement('div');
                                    div.className = 'command-line';
                                    div.setAttribute('data-text', text);
                                    displayBox.appendChild(div);
                                    lineElements.push(div);
                                });

                                function typeNext(index) {
                                    if (index >= lineElements.length) {
                                        afterAllLines();
                                        return;
                                    }
                                    const line = lineElements[index];
                                    const fullText = line.getAttribute('data-text');
                                    line.style.visibility = 'visible';
                                    line.classList.add('typing');
                                    line.innerText = '';
                                    let charIndex = 0;
                                    const timer = setInterval(function() {
                                        if (charIndex < fullText.length) {
                                            line.innerText += fullText.charAt(charIndex);
                                            charIndex++;
                                        } else {
                                            clearInterval(timer);
                                            line.classList.remove('typing');
                                            if (index === 1) {
                                                startProgress(line);
                                            } else {
                                                setTimeout(() => typeNext(index + 1), 200);
                                            }
                                        }
                                    }, 30);
                                }

                                function startProgress(lineElement) {
                                    let progress = 0;
                                    const maxProgress = 100;
                                    const totalDuration = 2000 + Math.random() * 4000;
                                    const startTime = Date.now();
                                    const baseText = '> Compiling: NoteEngine.Sync.Optimize() -> ';

                                    function updateProgress() {
                                        const elapsed = Date.now() - startTime;
                                        const ratio = Math.min(elapsed / totalDuration, 1);
                                        progress = Math.floor(ratio * maxProgress);
                                        lineElement.innerText = baseText + progress + '%';
                                        if (progress < maxProgress) {
                                            const nextDelay = 10 + Math.random() * 70;
                                            setTimeout(updateProgress, nextDelay);
                                        } else {
                                            lineElement.innerText = baseText + '100%';
                                            setTimeout(() => typeNext(2), 300);
                                        }
                                    }
                                    updateProgress();
                                }

                                function afterAllLines() {
                                    setTimeout(function() {
                                        window.setRainColor('#34d399');
                                        const canvas2 = document.getElementById('matrix-canvas');
                                        if (canvas2) canvas2.style.opacity = '0.05';

                                        let all = displayBox.querySelectorAll('.command-line');
                                        while (all.length > 2) {
                                            all[0].remove();
                                            all = displayBox.querySelectorAll('.command-line');

                                                    '> Status: Portal Gateway stabilized. Ready.'
                                                    );

                                        });
                                    }, 400);

                }

                function startWarpEffect(targetUrl) {

                    const canvas = warpCanvas;
                    const ctx = canvas.getContext('2d');

                    function resizeWarpCanvas() {
                        canvas.width = window.innerWidth;
                        canvas.height = window.innerHeight;
                    }
                    resizeWarpCanvas();
                    window.addEventListener('resize', resizeWarpCanvas);

                    const centerX = canvas.width / 2;
                    const centerY = canvas.height / 2;
                    const particleCount = 180;
                    warpParticles = [];

                    for (let i = 0; i < particleCount; i++) {
                        const angle = Math.random() * Math.PI * 2;
                        const radius = 20 + Math.random() * 60;
                        const speed = 2 + Math.random() * 6;
                        warpParticles.push({
                            x: centerX + Math.cos(angle) * radius,
                            y: centerY + Math.sin(angle) * radius,
                            vx: Math.cos(angle) * speed * (0.5 + Math.random()),
                            vy: Math.sin(angle) * speed * (0.5 + Math.random()),
                            size: 2 + Math.random() * 4,
                            life: 1,
                            decay: 0.003 + Math.random() * 0.005,
                            color: `hsl(${210 + Math.random() * 40}, 80%, ${60 + Math.random() * 30}%)`
                        });
                    }

                    for (let i = 0; i < 60; i++) {
                        const angle = Math.random() * Math.PI * 2;
                        const speed = 4 + Math.random() * 10;
                        warpParticles.push({
                            x: centerX,
                            y: centerY,
                            vx: Math.cos(angle) * speed * (0.5 + Math.random() * 0.5),
                            vy: Math.sin(angle) * speed * (0.5 + Math.random() * 0.5),
                            size: 1.5 + Math.random() * 3,
                            life: 1,
                            decay: 0.008 + Math.random() * 0.01,
                            color: `hsl(${200 + Math.random() * 50}, 90%, ${70 + Math.random() * 30}%)`
                        });
                    }

                    overlay.classList.add('active');

                    let startTime = Date.now();
                    const duration = 1200;

                    function drawWarp() {
                        const elapsed = Date.now() - startTime;
                        const progress = Math.min(elapsed / duration, 1);

                        ctx.clearRect(0, 0, canvas.width, canvas.height);

                        const glowRadius = 100 + progress * 300;
                        const gradient = ctx.createRadialGradient(
                            centerX, centerY, 10,
                            centerX, centerY, glowRadius
                        );
                        gradient.addColorStop(0, `rgba(0, 188, 255, ${0.15 * (1 - progress * 0.5)})`);
                        gradient.addColorStop(0.5, `rgba(0, 100, 255, ${0.05 * (1 - progress * 0.5)})`);
                        gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
                        ctx.fillStyle = gradient;
                        ctx.fillRect(0, 0, canvas.width, canvas.height);

                        for (const p of warpParticles) {
                            p.x += p.vx;
                            p.y += p.vy;
                            p.vx *= 0.99;
                            p.vy *= 0.99;
                            p.life -= p.decay;

                            if (p.life > 0) {
                                const alpha = p.life * 0.9;
                                ctx.beginPath();
                                ctx.arc(p.x, p.y, p.size * p.life * 0.8, 0, Math.PI * 2);
                                ctx.fillStyle = p.color;
                                ctx.globalAlpha = alpha;
                                ctx.fill();
                                ctx.globalAlpha = 1;

                                if (p.size > 2) {
                                    ctx.beginPath();
                                    ctx.arc(p.x, p.y, p.size * p.life * 1.8, 0, Math.PI * 2);
                                    ctx.fillStyle = `rgba(0, 188, 255, ${alpha * 0.15})`;
                                    ctx.fill();
                                }
                            }
                        }

                        const spinRadius = 30 + progress * 120;
                        const spinAngle = progress * Math.PI * 4;
                        for (let i = 0; i < 12; i++) {
                            const a = spinAngle + (i / 12) * Math.PI * 2;
                            const r = spinRadius + Math.sin(progress * 10 + i) * 30;
                            const x = centerX + Math.cos(a) * r;
                            const y = centerY + Math.sin(a) * r;
                            const size = 4 + Math.sin(progress * 8 + i * 2) * 2 + 2;
                            ctx.beginPath();
                            ctx.arc(x, y, size * (1 - progress * 0.3), 0, Math.PI * 2);
                            ctx.fillStyle = `rgba(0, 188, 255, ${0.3 * (1 - progress * 0.5)})`;
                            ctx.fill();
                        }

                        if (progress < 1) {
                            warpAnimId = requestAnimationFrame(drawWarp);
                        } else {
                            ctx.fillStyle = `rgba(255, 255, 255, 0.15)`;
                            ctx.fillRect(0, 0, canvas.width, canvas.height);
                            setTimeout(function() {
                                window.location.href = targetUrl;
                            }, 150);
                        }
                    }

                    drawWarp();

                    window.warpCleanup = function() {
                        if (warpAnimId) cancelAnimationFrame(warpAnimId);
                        overlay.classList.remove('active');
                        window.removeEventListener('resize', resizeWarpCanvas);
                    };
                }

                function goHomeWithWarp() {
                    if (window.warpCleanup) window.warpCleanup();
                    startWarpEffect('index.html');
                }

                btnHome.addEventListener('click', goHomeSimple);
                btnPortal.addEventListener('click', goHomeWithWarp);

                (function initMatrix() {
                    const canvas = document.getElementById('matrix-canvas');
                    if (!canvas) return;
                    const ctx = canvas.getContext('2d');

                    let width, height, columns, drops;
                    const fontSize = 12;
                    const alphabet = '010101ABCDEFGHIJKLMNOPQRSTUVWXYZ<>//$$'.split('');
                    let currentRainColor = '#58a6ff';
                    let animId = null;

                    function resizeCanvas() {
                        const rect = canvas.parentElement.getBoundingClientRect();
                        width = rect.width > 0 ? rect.width : 300;
                        height = rect.height > 0 ? rect.height : 110;
                        canvas.width = width;
                        canvas.height = height;
                        const isMobile = window.innerWidth < 768;
                        const colCount = isMobile ? Math.floor(width / (fontSize * 1.8)) : Math.floor(width / fontSize);
                        columns = Math.max(colCount, 10);
                        drops = Array(columns).fill(1);
                    }

                    function drawMatrix() {
                        ctx.fillStyle = 'rgba(13, 17, 23, 0.08)';
                        ctx.fillRect(0, 0, width, height);
                        ctx.fillStyle = currentRainColor;
                        ctx.font = fontSize + 'px monospace';
                        for (let i = 0; i < drops.length; i++) {
                            const text = alphabet[Math.floor(Math.random() * alphabet.length)];
                            ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                            if (drops[i] * fontSize > height && Math.random() > 0.975) {
                                drops[i] = 0;
                            }
                            drops[i]++;
                        }
                        animId = requestAnimationFrame(drawMatrix);
                    }

                    window.setRainColor = function(color) {
                        currentRainColor = color;
                    };

                    function startMatrix() {
                        resizeCanvas();
                        if (animId) cancelAnimationFrame(animId);
                        drawMatrix();
                    }

                    window.addEventListener('resize', function() {
                        resizeCanvas();
                        drops = Array(columns).fill(1);
                    });

                    if (document.readyState === 'complete') {
                        startMatrix();
                    } else {
                        window.addEventListener('load', startMatrix);
                    }
                })();

                console.log('[控制台] 两种跳转模式：普通→简单淡出，传送门→全屏特效');
            })();

            (function loadFriends() {
                const zone = document.getElementById('friendLinksZone');
                if (!zone) return;

                let links = [];
                if (typeof ALL_SOFTWARES !== 'undefined' && ALL_SOFTWARES.friendLinks) {
                    links = ALL_SOFTWARES.friendLinks.filter(l => l.siteName && l.jumpUrl && l.jumpUrl !== 'http://' && l
                        .jumpUrl !== '');
                }

                if (links.length) {
                    zone.innerHTML = links.map(l =>
                        `<a href="${l.jumpUrl}" target="_blank" class="friend-link-node">${l.siteName}</a>`
                    ).join('');
                    zone.style.display = 'flex';
                } else {
                    zone.style.display = 'none';
                }
            })();

            (function renderSocialLinks() {
                const container = document.getElementById('socialRow');
                if (!container) return;

                if (typeof ALL_SOFTWARES === 'undefined' || !ALL_SOFTWARES.socialLinks) {
                    container.style.display = 'none';
                    return;
                }

                const links = ALL_SOFTWARES.socialLinks.filter(function(item) {
                    return item.enabled === true && item.url && item.url.trim() !== '';
                });

                if (links.length === 0) {
                    container.style.display = 'none';
                    return;
                }

                container.innerHTML = '';
                links.forEach(function(item) {
                    const a = document.createElement('a');
                    a.href = '#';
                    a.title = item.name || item.platform || '社交链接';
                    a.textContent = item.icon || '🔗';
                    a.dataset.action = item.action || 'link';
                    a.dataset.url = item.url;
                    a.classList.add('social-link-item');
                    container.appendChild(a);
                });
                container.style.display = 'flex';
            })();

            function copyToClipboard(text) {
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(text)
                        .then(function() {
                            alert('✅ 已复制：' + text);
                        })
                        .catch(function() {
                            fallbackCopy(text);
                        });
                } else {
                    fallbackCopy(text);
                }
            }

            function fallbackCopy(text) {
                const textarea = document.createElement('textarea');
                textarea.value = text;
                document.body.appendChild(textarea);
                textarea.select();
                try {
                    document.execCommand('copy');
                    alert('✅ 已复制：' + text);
                } catch (err) {
                    alert('❌ 复制失败，请手动复制：' + text);
                }
                document.body.removeChild(textarea);
            }

            document.addEventListener('click', function(e) {
                const target = e.target.closest('.social-link-item');
                if (!target) return;

                e.preventDefault();

                const action = target.dataset.action;
                const url = target.dataset.url;

                if (action === 'link') {
                    window.open(url, '_blank');
                } else if (action === 'copy') {
                    copyToClipboard(url);
                }
            });

            console.log('✨ webmaster · 传送门逻辑分离 · 底部友情链接与主页一致 ✨');
        })();
    </script>
