<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>关于 Dream - 站长个人主页</title>
    <style>
        /* 1. 物理层级：锁定一页占满 */
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden; /* 禁止溢出滚动 */
            background-color: #f4f7fc; /* 微蓝灰底 */
            position: relative;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            display: flex;
            flex-direction: column; /* 纵向排列：头-中-尾 */
            position: relative;
            z-index: 1;
            transition: background-color 0.8s ease-out; /* 为最后的空间坍塌做准备 */
        }

        /* 2. 头部 */
        header {
            background-color: #1e293b; /* 雅黑色 */
            color: #fff;
            text-align: center;
            padding: 4vh 0; /* 略微缩窄，给核心卡片留空间 */
            flex-shrink: 0;
            border-bottom: 3px solid #0069f3;
        }

        header h1 {
            color: #ffffff;
            margin: 0;
            font-size: 1.8rem;
            letter-spacing: 4px;
            text-transform: uppercase;
        }
        header h1 span {
            color: #0069f3;
        }

        /* 3. 中间主体 */
        main {
            flex: 1; 
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        section {
            width: 95%;
            max-width: 650px;
            padding: 30px 35px;
            background-color: #fff;
            box-shadow: 0 15px 35px rgba(0, 105, 243, 0.04), 0 5px 15px rgba(0,0,0,0.02);
            border-radius: 16px;
            text-align: center;
            border: 1px solid rgba(0, 105, 243, 0.08);
            transition: all 1.2s cubic-bezier(0.22, 1, 0.36, 1); /* 延续慢速率 */
        }

        section:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 50px rgba(0, 105, 243, 0.08);
        }

        /* 头像 */
        .profile-img {
            border-radius: 50%;
            width: 110px;
            height: 110px;
            margin: 0 auto 15px;
            display: block;
            border: 4px solid #0069f3;
            background-color: #fff;
            transition: transform 2.5s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 1s ease;
            cursor: pointer;
        }

        .profile-img:hover {
            transform: rotate(360deg);
            box-shadow: 0 0 20px 8px rgba(0, 105, 243, 0.15);
        }

        h2 { color: #0f172a; margin-bottom: 12px; font-size: 1.4rem; font-weight: 700; }
        p { line-height: 1.7; color: #334155; margin: 8px 0; font-size: 0.98rem; }
        .highlight { color: #0069f3; font-weight: 600; }

        /* 【核心重构：黑客帝国动态控制台】 */
        .status-terminal {
            background: #0d1117; /* 深黑客色 */
            border: 1px solid #30363d;
            border-radius: 10px;
            padding: 15px;
            margin: 20px 0;
            text-align: left;
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 0.85rem;
            color: #58a6ff; /* 初始极客蓝 */
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
            transition: all 0.5s ease;
        }

        /* 隐藏彩蛋阶段：触发现场警报红光 */
        .status-terminal.warning-active {
            border-color: #ff3366;
            box-shadow: 0 0 25px rgba(255, 51, 102, 0.35), inset 0 0 15px rgba(255, 51, 102, 0.2);
            animation: terminalShake 0.4s ease-in-out 3;
        }

        @keyframes terminalShake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-3px); }
            40%, 80% { transform: translateX(3px); }
        }

        /* 黑客帝国背景画布 */
        #matrix-canvas {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0.12; /* 默认淡淡的阴影 */
            pointer-events: none;
            z-index: 0;
            transition: opacity 0.5s ease;
        }

        .terminal-content {
            position: relative;
            z-index: 1; /* 保证文字在画布上方 */
            min-height: 95px;
            display: flex;
            flex-direction: column;
        }

        .command-line {
            margin-bottom: 5px;
            white-space: nowrap;
            overflow: hidden;
            visibility: hidden; /* 默认隐藏，由JS动态打字显现 */
        }

        /* 正在打印的行显示光标 */
        .command-line.typing::after {
            content: '█';
            animation: blink 0.6s infinite;
            margin-left: 4px;
        }

        @keyframes blink {
            0%, 100% { opacity: 0; }
            50% { opacity: 1; }
        }

        /* 异常高危文本 */
        .text-alert {
            color: #ff3366 !important;
            font-weight: bold;
            text-shadow: 0 0 8px #ff3366;
        }

        /* 神秘任务文本 */
        .text-mission {
            color: #34d399 !important;
            text-shadow: 0 0 6px rgba(52, 211, 153, 0.4);
        }

        .social-icons {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #f1f5f9;
        }

        .social-icons a {
            display: inline-block;
            margin: 0 20px;
            color: #64748b;
            font-weight: 600;
            font-size: 0.9rem;
            text-decoration: none;
            position: relative;
            transition: color 0.5s ease;
        }

        .social-icons a::after {
            content: ''; position: absolute; width: 100%; transform: scaleX(0);
            height: 2px; bottom: -4px; left: 0; background-color: #0069f3;
            transform-origin: bottom right; transition: transform 0.4s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .social-icons a:hover { color: #0069f3; }
        .social-icons a:hover::after { transform: scaleX(1); transform-origin: bottom left; }

        /* 4. 底部动作区域 */
        .action-area {
            margin-top: 25px;
            padding-top: 15px;
            position: relative;
            min-height: 48px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .action-area a {
            transition: opacity 0.6s ease, transform 0.6s ease;
        }

        /* 传统按钮隐藏状态 */
        .action-area.hide-normal a {
            opacity: 0;
            pointer-events: none;
            transform: scale(0.8);
        }

        button {
            padding: 12px 50px;
            font-size: 0.9rem;
            font-weight: bold;
            background-color: #0069f3;
            color: #fff;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 6px 16px rgba(0, 105, 243, 0.15);
            transition: all 1s cubic-bezier(0.22, 1, 0.36, 1);
        }

        button:hover {
            background-color: #1e293b;
            transform: scale(1.03);
            box-shadow: 0 10px 20px rgba(30, 41, 59, 0.2);
        }

        /* 神秘空间传送门包装层 */
        .portal-wrapper {
            position: absolute;
            top: 0;
            opacity: 0;
            transform: scale(0.7);
            transition: all 1.2s cubic-bezier(0.34, 1.56, 0.64, 1);
            display: none;
        }

        .portal-wrapper.show {
            display: block;
            opacity: 1;
            transform: scale(1);
        }

        /* 核心传送漩涡纽 */
        .portal-btn {
            background: radial-gradient(circle, #001530 0%, #0d1117 70%) !important;
            color: #00bcff !important;
            border: 2px dashed #00bcff !important;
            box-shadow: 0 0 20px rgba(0, 188, 255, 0.3) !important;
            letter-spacing: 2px;
            overflow: hidden;
            position: relative;
        }

        /* 外环顺时针旋转粒子带 */
        .portal-btn::before {
            content: '';
            position: absolute;
            top: -50%; left: -50%; width: 200%; height: 200%;
            border: 2px dotted #34d399;
            border-radius: 46%;
            animation: rotatePortal 4s linear infinite;
            pointer-events: none;
            opacity: 0.5;
        }

        /* 内环逆时针反向轨道 */
        .portal-btn::after {
            content: '';
            position: absolute;
            top: -40%; left: -40%; width: 180%; height: 180%;
            border: 1px dashed #ff00ff;
            border-radius: 42%;
            animation: rotatePortalInverse 6s linear infinite;
            pointer-events: none;
            opacity: 0.3;
        }

        @keyframes rotatePortal {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes rotatePortalInverse {
            from { transform: rotate(360deg); }
            to { transform: rotate(0deg); }
        }

        .portal-btn:hover {
            color: #fff !important;
            border-color: #34d399 !important;
            box-shadow: 0 0 35px rgba(52, 211, 153, 0.7), inset 0 0 15px rgba(52, 211, 153, 0.3) !important;
            transform: scale(1.05);
        }

        /* 入场动画 */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .fade-in {
            animation: fadeIn 1.8s cubic-bezier(0.22, 1, 0.36, 1);
        }
    </style>
</head>
<body>

    <header>
        <h1>Dream <span>//</span> Space</h1>
    </header>

    <main>
        <section class="fade-in" id="main-card">
            <img src="picture/dlam.png" alt="Dream" class="profile-img">
            
            <h2>你好，我是 <span class="highlight">Dream</span></h2>
            
            <p>基于兴趣与直觉构建的空间，是我的第四维度。</p>
            <p>在这里，不去定义身份，只沉淀值得被固化的灵感。</p>
            <p>在 <span class="highlight">畅享工坊</span> 计划中,不定期共享绿色纯净自制轻量工具给大家。</p>

            <div class="status-terminal" id="terminal">
                <canvas id="matrix-canvas"></canvas>
                
                <div class="terminal-content" id="display-box">
                    <div class="command-line" data-text="> Initialize Identity... Done."></div>
                    <div class="command-line" data-text="> OS Environment: Dream space 10 [x64]"></div>
                    <div class="command-line" data-text="> Mission: Create a New World & Technological Tools"></div>
                    <div class="command-line" data-text="> Status: Core Engine is running smoothly..."></div>
                </div>
            </div>

            <div class="social-icons">
                <a href="https://space.bilibili.com/2027317299" target="_blank">BiliBili 空间</a>
                <a href="#" onclick="alert('摄影画廊还在整理中，敬请期待！'); return false;">500PX 画廊</a>
            </div>

            <div class="action-area" id="control-zone">
                <a href="index.html" style="text-decoration: none;">
                    <button>返回主页世界</button>
                </a>
                <div class="portal-wrapper" id="portal-zone">
                    <button class="portal-btn" onclick="executeWarp()">激活隐秘传送门 // WARP</button>
                </div>
            </div>
        </section>
    </main>

    <script>
        // --- 1. 黑客帝国「代码雨」后台特效驱动 ---
        const canvas = document.getElementById('matrix-canvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = canvas.parentElement.offsetWidth;
            canvas.height = canvas.parentElement.offsetHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        const alphabet = "010101ABCDEFGHIJKLMNOPQRSTUVWXYZ<>//$$*-%#".split("");
        const fontSize = 14;
        const columns = canvas.width / fontSize;
        const rainDrops = Array(Math.floor(columns)).fill(1);
        
        // 初始代码雨颜色与打字机文本完全统一
        let currentRainColor = '#58a6ff'; 

        function drawMatrix() {
            ctx.fillStyle = 'rgba(13, 17, 23, 0.06)'; // 维持优雅拖尾
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = currentRainColor; 
            ctx.font = fontSize + 'px monospace';

            for (let i = 0; i < rainDrops.length; i++) {
                const text = alphabet[Math.floor(Math.random() * alphabet.length)];
                ctx.fillText(text, i * fontSize, rainDrops[i] * fontSize);

                if (rainDrops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    rainDrops[i] = 0;
                }
                rainDrops[i]++;
            }
        }
        setInterval(drawMatrix, 40);


        // --- 2. 仿极客终端「动态逐行打字机」逻辑 ---
        const displayBox = document.getElementById('display-box');
        const terminal = document.getElementById('terminal');
        const controlZone = document.getElementById('control-zone');
        const portalZone = document.getElementById('portal-zone');
        
        let lines = Array.from(displayBox.querySelectorAll('.command-line'));
        let currentLineIndex = 0;

        function typeLine(elements, callback) {
            if (currentLineIndex >= elements.length) {
                if (callback) callback();
                return;
            }

            const line = elements[currentLineIndex];
            const fullText = line.getAttribute('data-text');
            line.style.visibility = 'visible';
            line.classList.add('typing');

            let currentCharIndex = 0;
            line.innerText = '';

            const timer = setInterval(() => {
                if (currentCharIndex < fullText.length) {
                    line.innerText += fullText.charAt(currentCharIndex);
                    currentCharIndex++;
                } else {
                    clearInterval(timer);
                    line.classList.remove('typing'); 
                    currentLineIndex++;
                    setTimeout(() => typeLine(elements, callback), 300);
                }
            }, 35);
        }

        // 页面载入 0.5 秒正式启动第一波正常打印
        setTimeout(() => {
            typeLine(lines, () => {
                // 第一波打印结束后，启动隐藏挂机等待检测轴
                startSecretTimeline();
            });
        }, 500);


        // --- 3. 核心：隐藏神秘传送门触发时间轴 ---
        function startSecretTimeline() {
            // 【阶段二：停留 6 秒后，突发系统威胁警告】
            setTimeout(() => {
                terminal.classList.add('warning-active');
                currentRainColor = '#ff3366'; // 全局代码雨染红
                
                injectInstantLine("> [CRITICAL] ANOMALOUS OVERFLOW DETECTED.", "text-alert");
                injectInstantLine("> [WARNING] SPATIAL LAYER BREACH IN PROGRESS...", "text-alert");
            }, 6000);

            // 【阶段三：急速协议加载灌注】—— 警告发生 3.5 秒后
            setTimeout(() => {
                currentRainColor = '#00bcff'; // 转为科技高光蓝
                canvas.style.opacity = "0.35"; // 代码雨亮度强化
                
                let loadCount = 0;
                let fastLoadTimer = setInterval(() => {
                    const injectionCodes = [
                        `> Injecting: Sockets.Connecting_To(Fourth_Dimension)...`,
                        `> Compiling: NoteEngine.Sync.Optimizer.ExtractDelta() -> 100%`,
                        `> Buffer: Allocating quantum portal structure stack [0x7FFF]`,
                        `> Handshake: Gateway verification successfully passed.`,
                        `> Info: Initializing wormhole anchor link configuration...`
                    ];
                    injectInstantLine(injectionCodes[loadCount % injectionCodes.length]);
                    loadCount++;
                    
                    if (loadCount >= 6) {
                        clearInterval(fastLoadTimer);
                        triggerMissionPhase(); // 触发阶段四
                    }
                }, 450);
            }, 9500);
        }

        // 【阶段四：核心内容收缩，发布隐藏指令】
        function triggerMissionPhase() {
            canvas.style.opacity = "0.05"; // 弱化背景代码雨，聚焦文本
            currentRainColor = '#34d399';  // 切换为安全的任务翡翠绿
            
            // 清洗早期干扰行，为传送门腾出空间
            const allLines = displayBox.querySelectorAll('.command-line');
            for(let i=0; i < allLines.length - 2; i++) {
                allLines[i].remove();
            }

            // 动态注入带有打字机特效的最终任务描述
            const m1 = createDelayLine("> [MISSION]: 发现一条通往未知维度的奇点时空隧道。", "text-mission");
            const m2 = createDelayLine("> [ACTION]: 点击下方粒子漩涡核执行次元跃迁。", "text-mission");
            
            currentLineIndex = 0;
            typeLine([m1, m2], () => {
                // 【阶段五：切换底部空间，融合传送门降临】
                setTimeout(() => {
                    controlZone.classList.add('hide-normal'); // 隐去返回主页世界按钮
                    portalZone.classList.add('show');          // 浮现跃迁传送门
                    injectInstantLine("> Status: Portal Gateway stabilized. Ready for warp.");
                }, 600);
            });
        }


        // --- 4. 动态 DOM 操纵辅助小工具 ---
        function injectInstantLine(text, customClass = '') {
            const div = document.createElement('div');
            div.className = `command-line ${customClass}`;
            div.style.visibility = 'visible';
            div.innerText = text;
            displayBox.appendChild(div);
            autoScrollTrim();
        }

        function createDelayLine(text, customClass = '') {
            const div = document.createElement('div');
            div.className = `command-line ${customClass}`;
            div.setAttribute('data-text', text);
            displayBox.appendChild(div);
            autoScrollTrim();
            return div;
        }

        function autoScrollTrim() {
            const currentLines = displayBox.querySelectorAll('.command-line');
            if (currentLines.length > 5) {
                currentLines[0].remove(); // 超出限制自动置顶裁剪，防止撑开卡片布局
            }
        }

        // --- 5. 最终次元扭曲坍塌跳转 ---
        function executeWarp() {
            const mainCard = document.getElementById('main-card');
            
            // 卡片急速缩小旋转，背景变白，模拟空间被剥离效果
            mainCard.style.transform = "scale(0.01) rotate(1080deg)";
            mainCard.style.opacity = "0";
            document.body.style.backgroundColor = "#ffffff";
            
            setTimeout(() => {
                window.location.href = "index.html"; // 传送目的地
            }, 900);
        }
    </script>
</body>
</html>
