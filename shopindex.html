<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
    <title>畅享创意工坊</title>
    <style>
        :root {
            --brand-blue: #4A90E2;
            --brand-blue-bright: #5BA0F5;
            --brand-blue-dark: #2D6BA8;
            --bg-start: #F8FAFF;
            --bg-end: #F0F5FF;
            --glass-bg: rgba(255, 255, 255, 0.75);
            --glass-border: rgba(74, 144, 226, 0.10);
            --shadow-blue: rgba(74, 144, 226, 0.06);
            --shadow-hover: rgba(74, 144, 226, 0.14);
            --transition-smooth: cubic-bezier(0.22, 1, 0.36, 1);
            --radius: 20px;
            --radius-sm: 12px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, 'Noto Sans SC', 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(145deg, var(--bg-start) 0%, var(--bg-end) 100%);
            color: #1A2A4A;
            overflow-x: hidden;
            scroll-behavior: smooth;
            line-height: 1.6;
            min-height: 100vh;
        }

        .navbar {
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            background: rgba(255, 255, 255, 0.72);
            border-bottom: 1px solid rgba(74, 144, 226, 0.08);
            padding: 10px 24px;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            flex-wrap: wrap;
            gap: 10px 24px;
        }

        .navbar .logo {
            font-size: 1.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--brand-blue), var(--brand-blue-bright));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-decoration: none;
            flex-shrink: 0;
        }

        .navbar .logo small {
            font-size: 0.8rem;
            font-weight: 400;
            -webkit-text-fill-color: #5A6A8A;
            color: #5A6A8A;
            background: none;
        }

        .nav-links {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            align-items: center;
        }

        .nav-links a {
            color: #4A5A7A;
            text-decoration: none;
            padding: 6px 14px;
            font-size: 0.85rem;
            font-weight: 600;
            border-radius: 30px;
            transition: all 0.3s ease;
        }

        .nav-links a:hover {
            color: var(--brand-blue);
            background: rgba(74, 144, 226, 0.06);
        }

        .nav-links a.active {
            color: var(--brand-blue);
            background: rgba(74, 144, 226, 0.08);
        }

        .main-container {
            max-width: 1240px;
            margin: 24px auto;
            padding: 0 20px 40px;
            display: flex;
            gap: 24px;
            flex: 1;
            width: 100%;
        }

        .sidebar-wrapper {
            width: 220px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            flex-shrink: 0;
            position: sticky;
            top: 80px;
            align-self: flex-start;
        }

        .sidebar {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: var(--radius-sm);
            padding: 16px;
            border: 1px solid var(--glass-border);
            box-shadow: 0 4px 24px var(--shadow-blue);
            transition: all 0.3s var(--transition-smooth);
        }
        .sidebar:hover {
            box-shadow: 0 8px 36px var(--shadow-hover);
            border-color: rgba(74, 144, 226, 0.15);
        }

        .sidebar-title {
            font-size: 0.7rem;
            font-weight: 700;
            color: var(--brand-blue);
            padding: 0 4px 12px;
            border-bottom: 2px solid rgba(74, 144, 226, 0.06);
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .category-list {
            list-style: none;
        }
        .category-item {
            padding: 9px 12px;
            margin-bottom: 3px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.88rem;
            color: #5A6A8A;
            font-weight: 500;
            transition: all 0.25s;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .category-item:hover {
            background: rgba(74, 144, 226, 0.06);
            color: var(--brand-blue);
        }
        .category-item.active {
            background: var(--brand-blue);
            color: #fff;
            font-weight: 600;
            box-shadow: 0 4px 12px rgba(74, 144, 226, 0.25);
        }

        .sidebar-notice-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: var(--radius-sm);
            padding: 16px;
            border: 1px solid var(--glass-border);
            box-shadow: 0 4px 24px var(--shadow-blue);
            transition: all 0.3s var(--transition-smooth);
        }
        .sidebar-notice-panel:hover {
            box-shadow: 0 8px 36px var(--shadow-hover);
            border-color: rgba(74, 144, 226, 0.15);
        }

        .notice-sub-title {
            font-size: 0.7rem;
            font-weight: 700;
            color: var(--brand-blue);
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .notice-carousel {
            position: relative;
            overflow: hidden;
            min-height: 50px;
        }
        .notice-slide {
            display: none;
            animation: fadeSlide 0.5s ease forwards;
            font-size: 0.82rem;
            color: #475569;
            line-height: 1.6;
            background: rgba(74, 144, 226, 0.04);
            padding: 10px 14px;
            border-radius: 8px;
            border-left: 3px solid var(--brand-blue);
            word-break: break-word;
        }
        .notice-slide.active {
            display: block;
        }
        @keyframes fadeSlide {
            0% { opacity: 0; transform: translateY(6px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .notice-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-top: 10px;
            padding-top: 8px;
            border-top: 1px solid rgba(74, 144, 226, 0.06);
        }
        .notice-controls.hidden {
            display: none;
        }
        .notice-arrow {
            background: none;
            border: none;
            font-size: 0.9rem;
            color: #94A3B8;
            cursor: pointer;
            padding: 0 4px;
            transition: color 0.2s;
        }
        .notice-arrow:hover {
            color: var(--brand-blue);
        }
        .notice-dots {
            display: flex;
            gap: 5px;
            align-items: center;
        }
        .notice-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #DCE4EC;
            border: none;
            padding: 0;
            cursor: pointer;
            transition: background 0.2s, transform 0.2s;
        }
        .notice-dot.active {
            background: var(--brand-blue);
            transform: scale(1.2);
        }

        .recommend-zone {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: var(--radius-sm);
            padding: 16px;
            border: 1px solid var(--glass-border);
            box-shadow: 0 4px 24px var(--shadow-blue);
            transition: all 0.3s var(--transition-smooth);
        }
        .recommend-zone:hover {
            box-shadow: 0 8px 36px var(--shadow-hover);
            border-color: rgba(74, 144, 226, 0.15);
        }

        .recommend-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .recommend-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.82rem;
            color: #5A6A8A;
            padding: 7px 10px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 8px;
            border: 1px solid rgba(74, 144, 226, 0.04);
            transition: 0.2s;
        }
        .recommend-item:hover {
            border-color: rgba(74, 144, 226, 0.12);
            background: rgba(74, 144, 226, 0.04);
        }
        .recommend-item a {
            color: var(--brand-blue);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.72rem;
            padding: 2px 10px;
            border-radius: 20px;
            background: rgba(74, 144, 226, 0.06);
            transition: 0.2s;
        }
        .recommend-item a:hover {
            background: var(--brand-blue);
            color: #fff;
        }

        .content-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 16px;
            min-width: 0;
        }

        #hotCarouselContainer {
            display: none;
        }
        .hot-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }
        .hot-header .icon {
            font-size: 1.4rem;
        }
        .hot-header .title {
            font-weight: 700;
            font-size: 1.1rem;
            color: #1A2A4A;
        }

        .hot-wrapper {
            position: relative;
            overflow: hidden;
            border-radius: var(--radius-sm);
            background: var(--glass-bg);
            backdrop-filter: blur(4px);
            border: 1px solid var(--glass-border);
            box-shadow: 0 4px 24px var(--shadow-blue);
            padding: 0;
        }
        .hot-track {
            display: flex;
            transition: transform 0.5s ease;
            will-change: transform;
        }

        .hot-slide {
            flex: 0 0 100%;
            display: flex;
            align-items: center;
            text-decoration: none;
            color: inherit;
            padding: 20px 24px;
            min-height: 150px;
            background: transparent;
            transition: background 0.3s;
            cursor: pointer;
        }
        .hot-slide:hover {
            background: rgba(74, 144, 226, 0.03);
        }
        .hot-slide img {
            width: 96px;
            height: 96px;
            object-fit: cover;
            border-radius: 14px;
            margin-right: 24px;
            flex-shrink: 0;
            background: #f1f5f9;
        }
        .hot-slide .info {
            flex: 1;
        }
        .hot-slide .info h3 {
            font-size: 1.15rem;
            font-weight: 700;
            color: #1A2A4A;
            margin-bottom: 4px;
        }
        .hot-slide .info p {
            font-size: 0.92rem;
            color: #64748b;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            line-height: 1.5;
        }

        .hot-indicators {
            position: absolute;
            bottom: 14px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 8px;
            z-index: 2;
        }
        .hot-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: rgba(74, 144, 226, 0.2);
            cursor: pointer;
            border: none;
            padding: 0;
            transition: background 0.3s;
        }
        .hot-dot.active {
            background: var(--brand-blue);
        }

        .hot-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(74, 144, 226, 0.1);
            border-radius: 50%;
            width: 36px;
            height: 36px;
            font-size: 1.3rem;
            cursor: pointer;
            z-index: 3;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #4A5A7A;
            transition: background 0.2s;
            line-height: 1;
        }
        .hot-btn:hover {
            background: rgba(255, 255, 255, 0.9);
        }
        .hot-btn.prev {
            left: 8px;
        }
        .hot-btn.next {
            right: 8px;
        }

        .control-bar {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 12px 18px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--glass-border);
            box-shadow: 0 4px 24px var(--shadow-blue);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            scroll-margin-top: 20px;
            transition: all 0.3s var(--transition-smooth);
        }
        .control-bar:hover {
            box-shadow: 0 8px 36px var(--shadow-hover);
            border-color: rgba(74, 144, 226, 0.15);
        }
        .control-bar h2 {
            font-size: 0.95rem;
            color: #1A2A4A;
            font-weight: 700;
            white-space: nowrap;
        }
        .control-bar h2 span {
            color: var(--brand-blue);
        }

        .search-box-wrapper {
            position: relative;
            flex-grow: 1;
            max-width: 280px;
        }
        .search-input {
            width: 100%;
            padding: 7px 12px 7px 34px;
            font-size: 0.82rem;
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(74, 144, 226, 0.12);
            border-radius: 30px;
            outline: none;
            transition: all 0.3s;
        }
        .search-input:focus {
            background: rgba(255, 255, 255, 0.9);
            border-color: var(--brand-blue);
        }
        .search-icon {
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            width: 14px;
            height: 14px;
            color: #94A3B8;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(155px, 1fr));
            gap: 16px;
        }

        .item {
            background: var(--glass-bg);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-radius: var(--radius-sm);
            overflow: hidden;
            transition: all 0.4s var(--transition-smooth);
            border: 1px solid var(--glass-border);
            box-shadow: 0 4px 20px var(--shadow-blue);
            display: flex;
            flex-direction: column;
        }
        .item:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 40px var(--shadow-hover);
            border-color: rgba(74, 144, 226, 0.2);
        }

        .item-image-wrapper {
            width: 100%;
            aspect-ratio: 1 / 1;
            background: rgba(248, 250, 252, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            border-bottom: 1px solid rgba(74, 144, 226, 0.04);
            overflow: hidden;
        }
        .item-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .item-content {
            padding: 10px 10px 12px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .item-title-row {
            display: flex;
            align-items: baseline;
            gap: 4px;
            min-height: 2.2em;
        }
        .item-zodiac {
            font-size: 0.7rem;
            color: #8A9AA8;
            opacity: 0.6;
            line-height: 1;
            flex-shrink: 0;
        }
        .item-title {
            font-size: 0.82rem;
            font-weight: 600;
            color: #1A2A4A;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            line-height: 1.4;
        }
        .item-link {
            display: block;
            text-align: center;
            background: linear-gradient(135deg, var(--brand-blue), var(--brand-blue-bright));
            color: #fff;
            text-decoration: none;
            padding: 5px 0;
            border-radius: 30px;
            font-size: 0.7rem;
            font-weight: 600;
            transition: all 0.3s;
            margin-top: 4px;
        }
        .item-link:hover {
            transform: scale(1.02);
            box-shadow: 0 4px 12px rgba(74, 144, 226, 0.25);
        }

        .skeleton-card {
            background: var(--glass-bg);
            backdrop-filter: blur(4px);
            border-radius: var(--radius-sm);
            overflow: hidden;
            border: 1px solid var(--glass-border);
            display: flex;
            flex-direction: column;
        }
        .skeleton-img {
            width: 100%;
            aspect-ratio: 1/1;
            background: linear-gradient(90deg, rgba(200, 215, 230, 0.15) 25%, rgba(220, 235, 248, 0.25) 50%, rgba(200, 215, 230, 0.15) 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }
        .skeleton-body {
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .skeleton-line {
            height: 12px;
            border-radius: 6px;
            background: linear-gradient(90deg, rgba(200, 215, 230, 0.15) 25%, rgba(220, 235, 248, 0.25) 50%, rgba(200, 215, 230, 0.15) 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }
        .skeleton-line--short {
            width: 60%;
        }
        .skeleton-line--btn {
            height: 24px;
            border-radius: 30px;
            margin-top: 2px;
        }
        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        .pagination-bar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 16px 28px;
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 12px 24px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--glass-border);
            box-shadow: 0 4px 24px var(--shadow-blue);
            margin-top: 4px;
            transition: all 0.3s var(--transition-smooth);
        }
        .pagination-bar:hover {
            box-shadow: 0 8px 36px var(--shadow-hover);
            border-color: rgba(74, 144, 226, 0.15);
        }

        .pagination-group {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .pagination-group--jump {
            gap: 6px;
        }

        .page-btn {
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(74, 144, 226, 0.1);
            border-radius: 30px;
            padding: 4px 16px;
            font-size: 0.82rem;
            cursor: pointer;
            transition: all 0.2s;
            color: #4A5A7A;
            font-weight: 500;
        }
        .page-btn:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.8);
            border-color: var(--brand-blue);
            color: var(--brand-blue);
        }
        .page-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            pointer-events: none;
        }

        #pageInfo {
            font-weight: 600;
            color: #1A2A4A;
            font-size: 0.88rem;
            white-space: nowrap;
            padding: 0 4px;
        }

        .page-jump {
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .page-jump span {
            font-size: 0.8rem;
            color: #64748B;
        }
        .page-jump input {
            width: 48px;
            padding: 3px 4px;
            border: 1px solid rgba(74, 144, 226, 0.12);
            border-radius: 30px;
            text-align: center;
            font-size: 0.8rem;
            background: rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(4px);
            outline: none;
        }
        .page-jump input:focus {
            border-color: var(--brand-blue);
            background: rgba(255, 255, 255, 0.8);
        }
        .page-jump button {
            padding: 3px 12px;
            background: linear-gradient(135deg, var(--brand-blue), var(--brand-blue-bright));
            color: #fff;
            border: none;
            border-radius: 30px;
            font-size: 0.72rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .page-jump button:hover {
            transform: scale(1.02);
            box-shadow: 0 4px 12px rgba(74, 144, 226, 0.25);
        }

        .site-footer {
            text-align: center;
            padding: 24px 20px 20px;
            color: #8A9AB0;
            font-size: 0.8rem;
            border-top: 1px solid rgba(74, 144, 226, 0.06);
            margin-top: 10px;
        }
        .site-footer a {
            color: var(--brand-blue);
            text-decoration: none;
        }
        .site-footer a:hover {
            color: var(--brand-blue-dark);
        }

        .friend-links-zone {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            padding: 0 0 10px;
            font-size: 0.78rem;
            color: #64748b;
        }
        .friend-link-node {
            color: #64748b;
            text-decoration: none;
            transition: 0.2s;
        }
        .friend-link-node:hover {
            color: var(--brand-blue);
        }

        .mobile-recommend {
            display: none;
        }
        .mobile-recommend .recommend-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .mobile-recommend .recommend-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.82rem;
            color: #5A6A8A;
            padding: 8px 12px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 8px;
            border: 1px solid rgba(74, 144, 226, 0.04);
        }
        .mobile-recommend .recommend-item a {
            color: var(--brand-blue);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.72rem;
            padding: 2px 10px;
            border-radius: 20px;
            background: rgba(74, 144, 226, 0.06);
        }
        .mobile-recommend .recommend-item a:hover {
            background: var(--brand-blue);
            color: #fff;
        }

        .content-notice-panel {
            display: none;
        }

        @media (max-width: 1024px) {
            .sidebar-wrapper {
                width: 190px;
            }
            .grid-container {
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
                gap: 12px;
            }
        }

        @media (max-width: 768px) {
            .navbar {
                padding: 8px 16px;
                gap: 6px 16px;
            }
            .navbar .logo {
                font-size: 1.2rem;
            }
            .nav-links a {
                padding: 4px 10px;
                font-size: 0.75rem;
            }

            .main-container {
                flex-direction: column;
                padding: 12px 12px 30px;
                gap: 14px;
            }

            .sidebar-wrapper {
                width: 100%;
                flex-direction: row;

    <script>
        let allProducts = [];
        let categories = ["全部资源"];
        let currentCategory = "全部资源";
        let searchKeyword = "";
        const PAGE_SIZE = 20;
        let currentPage = 0;
        const ZODIAC = ['🐭', '🐮', '🐯', '🐰', '🐲', '🐍', '🐴', '🐏', '🐵', '🐔', '🐶', '🐷'];

        function updateUrlParams() {
            const params = new URLSearchParams();
            if (currentCategory && currentCategory !== "全部资源") {
                params.set('category', currentCategory);
            }
            if (currentPage > 0) {
                params.set('page', currentPage + 1);
            }
            if (searchKeyword) {
                params.set('search', searchKeyword);
            }
            const newUrl = window.location.pathname + (params.toString() ? '?' + params.toString() : '');
            history.pushState({ category: currentCategory, page: currentPage, search: searchKeyword }, '', newUrl);
        }

        function initNoticeBoard(config) {
            const {
                containerId,
                carouselId,
                dotsId,
                prevId,
                nextId,
                interval = 5000
            } = config;

            const container = document.getElementById(containerId);
            if (!container) return null;

            const carousel = document.getElementById(carouselId);
            const dotsContainer = document.getElementById(dotsId);
            const prevBtn = document.getElementById(prevId);
            const nextBtn = document.getElementById(nextId);

            if (!carousel || !dotsContainer || !prevBtn || !nextBtn) return null;

            let list = [];
            if (typeof ALL_SOFTWARES !== 'undefined' && ALL_SOFTWARES.announcements && ALL_SOFTWARES.announcements.length >
                0) {
                list = ALL_SOFTWARES.announcements.filter(ann => ann.title && ann.title.trim() !== '');
            }

            carousel.innerHTML = '';
            dotsContainer.innerHTML = '';

            if (list.length === 0) {
                container.style.display = 'none';
                return null;
            }

            let currentIndex = 0;
            let timer = null;

            list.forEach((ann, idx) => {
                const slide = document.createElement('div');
                slide.className = 'notice-slide' + (idx === 0 ? ' active' : '');
                slide.textContent = ann.title;
                slide.dataset.index = idx;
                carousel.appendChild(slide);

                const dot = document.createElement('button');
                dot.className = 'notice-dot' + (idx === 0 ? ' active' : '');
                dot.dataset.index = idx;
                dot.setAttribute('aria-label', '切换到公告 ' + (idx + 1));
                dotsContainer.appendChild(dot);
            });

            const controls = container.querySelector('.notice-controls');
            if (controls) {
                if (list.length <= 1) {
                    controls.classList.add('hidden');
                } else {
                    controls.classList.remove('hidden');
                }
            }

            function goTo(index) {
                if (list.length === 0) return;
                if (index < 0) index = list.length - 1;
                if (index >= list.length) index = 0;
                if (index === currentIndex) return;
                currentIndex = index;

                const slides = carousel.querySelectorAll('.notice-slide');
                const dots = dotsContainer.querySelectorAll('.notice-dot');
                slides.forEach((s, i) => { s.classList.toggle('active', i === currentIndex); });
                dots.forEach((d, i) => { d.classList.toggle('active', i === currentIndex); });
            }

            function next() { goTo(currentIndex + 1); }

            function prev() { goTo(currentIndex - 1); }

            function startAuto() {
                if (list.length <= 1) return;
                if (timer) clearInterval(timer);
                timer = setInterval(next, interval);
            }

            function stopAuto() {
                if (timer) { clearInterval(timer);
                    timer = null; }
            }

            function resetAuto() {
                stopAuto();
                startAuto();
            }

            prevBtn.addEventListener('click', () => { prev();
                resetAuto(); });
            nextBtn.addEventListener('click', () => { next();
                resetAuto(); });

            dotsContainer.querySelectorAll('.notice-dot').forEach(dot => {
                dot.addEventListener('click', function() {
                    const idx = parseInt(this.dataset.index, 10);
                    if (!isNaN(idx) && idx !== currentIndex) {
                        goTo(idx);
                        resetAuto();
                    }
                });
            });

            container.addEventListener('mouseenter', stopAuto);
            container.addEventListener('mouseleave', startAuto);
            container.addEventListener('touchstart', stopAuto, { passive: true });
            container.addEventListener('touchend', startAuto, { passive: true });

            startAuto();

            return {
                goTo,
                next,
                prev,
                startAuto,
                stopAuto,
                resetAuto,
                getCurrentIndex: () => currentIndex,
                getList: () => list
            };
        }

        document.addEventListener('DOMContentLoaded', function() {

            if (typeof ALL_SOFTWARES === 'undefined' || !ALL_SOFTWARES.products) {
                document.getElementById('productGrid').innerHTML =
                    '<div style="grid-column:1/-1;text-align:center;color:#EF4444;padding:40px;">⚠️ 数据加载失败，请检查 softwares.js 文件。</div>';
                return;
            }
            allProducts = ALL_SOFTWARES.products;

            if (ALL_SOFTWARES.categories && Array.isArray(ALL_SOFTWARES.categories) && ALL_SOFTWARES.categories.length > 0) {
                categories = ["全部资源", ...ALL_SOFTWARES.categories];
            } else {
                const catSet = new Set();
                allProducts.forEach(p => { if (p.category) catSet.add(p.category); });
                categories = ["全部资源", ...Array.from(catSet)];
            }

            const urlParams = new URLSearchParams(window.location.search);
            const categoryParam = urlParams.get('category');
            if (categoryParam && categories.includes(categoryParam)) {
                currentCategory = categoryParam;
            } else {
                currentCategory = "全部资源";
            }
            const pageParam = parseInt(urlParams.get('page'), 10);
            if (!isNaN(pageParam) && pageParam >= 1) {
                currentPage = pageParam - 1;
            } else {
                currentPage = 0;
            }
            const searchParam = urlParams.get('search');
            if (searchParam) {
                searchKeyword = searchParam;
                document.getElementById('searchInput').value = searchKeyword;
            }

            renderCategories();
            loadHotCarousel();
            loadRecommendations();
            loadFriendLinks();
            updateCategoryUI(currentCategory);
            renderProductGrid();
            handleMobileRecommend();

            initNoticeBoard({
                containerId: 'noticePanel',
                carouselId: 'noticeCarousel',
                dotsId: 'noticeDots',
                prevId: 'noticePrev',
                nextId: 'noticeNext',
                interval: 5000
            });

            initNoticeBoard({
                containerId: 'noticePanelMobile',
                carouselId: 'noticeCarouselMobile',
                dotsId: 'noticeDotsMobile',
                prevId: 'noticePrevMobile',
                nextId: 'noticeNextMobile',
                interval: 5000
            });

            const searchInput = document.getElementById('searchInput');
            searchInput.addEventListener('input', function(e) {
                searchKeyword = e.target.value.trim().toLowerCase();
                currentPage = 0;
                renderProductGrid();
                updateUrlParams();
            });

            document.getElementById('prevPageBtn').addEventListener('click', function() {
                if (currentPage > 0) { currentPage--;
                    renderProductGrid();
                    scrollToControlBar();
                    updateUrlParams(); }
            });
            document.getElementById('nextPageBtn').addEventListener('click', function() {
                const total = getFilteredCount();
                const totalPages = Math.ceil(total / PAGE_SIZE);
                if (currentPage < totalPages - 1) { currentPage++;
                    renderProductGrid();
                    scrollToControlBar();
                    updateUrlParams(); }
            });
            document.getElementById('pageJumpBtn').addEventListener('click', function() {
                const input = document.getElementById('pageJumpInput');
                let val = parseInt(input.value.trim(), 10);
                const total = getFilteredCount();
                const totalPages = Math.ceil(total / PAGE_SIZE);
                if (isNaN(val) || val < 1) val = 1;
                if (val > totalPages) val = totalPages;
                if (val >= 1 && val <= totalPages) {
                    currentPage = val - 1;
                    renderProductGrid();
                    scrollToControlBar();
                    updateUrlParams();
                }
                input.value = '';
            });
            document.getElementById('pageJumpInput').addEventListener('keydown', function(e) {
                if (e.key === 'Enter') { document.getElementById('pageJumpBtn').click(); }
            });

            window.addEventListener('resize', handleMobileRecommend);

            renderProductGrid();
        });

        function handleMobileRecommend() {
            const isMobile = window.innerWidth <= 768;
            const zone = document.getElementById('recommendZone');
            const mobileZone = document.getElementById('mobileRecommend');
            if (!zone || !mobileZone) return;

            if (isMobile) {
                zone.style.display = 'none';
                mobileZone.style.display = 'block';
                const sideList = document.getElementById('recommendList');
                const mobileList = document.getElementById('mobileRecommendList');
                if (sideList && mobileList) {
                    mobileList.innerHTML = sideList.innerHTML;
                }
            } else {
                zone.style.display = 'block';
                mobileZone.style.display = 'none';
            }
        }

        function loadHotCarousel() {
            const container = document.getElementById('hotCarouselContainer');
            const track = document.getElementById('hotTrack');
            const indicators = document.getElementById('hotIndicators');
            const prevBtn = document.getElementById('hotPrev');
            const nextBtn = document.getElementById('hotNext');

            let hotIds = [];
            if (typeof ALL_SOFTWARES !== 'undefined' && ALL_SOFTWARES.hotRecommendIds) {
                hotIds = ALL_SOFTWARES.hotRecommendIds;
            }
            const hotItems = allProducts.filter(p => hotIds.includes(p.id));

            if (hotItems.length === 0) {
                container.style.display = 'none';
                return;
            }
            container.style.display = 'block';
            track.innerHTML = '';
            indicators.innerHTML = '';

            hotItems.forEach((product, index) => {
                const slide = document.createElement('a');
                slide.className = 'hot-slide';
                let detailUrl, targetAttr = '';
                if (product.detailPageType === "自定义模板" && product.detailPagePath) {
                    detailUrl = product.detailPagePath;
                    targetAttr = '_blank';
                } else {
                    detailUrl = 'tail.html?id=' + product.id;
                }
                slide.href = detailUrl;
                if (targetAttr) slide.target = targetAttr;

                const img = document.createElement('img');
                const logo = product.mainImage && product.mainImage.trim() !== '' ? product.mainImage : 'logo/default.png';
                img.src = logo;
                img.alt = product.name;
                img.onerror = function() { this.src = 'logo/default.png'; };

                const info = document.createElement('div');
                info.className = 'info';
                const title = document.createElement('h3');
                title.textContent = product.name;
                const desc = document.createElement('p');
                const shortDesc = product.description ? product.description.replace(/\r?\n/g, ' ').substring(0, 60) +
                    '...' : '点击查看详情';
                desc.textContent = shortDesc;

                info.appendChild(title);
                info.appendChild(desc);
                slide.appendChild(img);
                slide.appendChild(info);
                track.appendChild(slide);

                const dot = document.createElement('button');
                dot.className = 'hot-dot' + (index === 0 ? ' active' : '');
                dot.dataset.index = index;
                indicators.appendChild(dot);
            });

            let currentIndex = 0;
            const total = hotItems.length;
            let autoTimer = null;

            function goTo(index) {
                if (index < 0) index = total - 1;
                if (index >= total) index = 0;
                currentIndex = index;
                track.style.transform = 'translateX(-' + (currentIndex * 100) + '%)';
                document.querySelectorAll('.hot-dot').forEach(function(dot, i) {
                    dot.classList.toggle('active', i === currentIndex);
                });
            }

            function nextSlide() { goTo(currentIndex + 1); }

            function prevSlide() { goTo(currentIndex - 1); }

            prevBtn.addEventListener('click', function() { prevSlide();
                resetAutoPlay(); });
            nextBtn.addEventListener('click', function() { nextSlide();
                resetAutoPlay(); });

            document.querySelectorAll('.hot-dot').forEach(function(dot) {
                dot.addEventListener('click', function() {
                    const idx = parseInt(this.dataset.index, 10);
                    if (!isNaN(idx)) { goTo(idx);
                        resetAutoPlay(); }
                });
            });

            function startAutoPlay() {
                if (autoTimer) clearInterval(autoTimer);
                autoTimer = setInterval(nextSlide, 5000);
            }

            function resetAutoPlay() {
                clearInterval(autoTimer);
                startAutoPlay();
            }
            startAutoPlay();

            const wrapper = document.querySelector('.hot-wrapper');
            wrapper.addEventListener('mouseenter', function() { clearInterval(autoTimer); });
            wrapper.addEventListener('mouseleave', startAutoPlay);
            wrapper.addEventListener('touchstart', function() { clearInterval(autoTimer); }, { passive: true });
            wrapper.addEventListener('touchend', startAutoPlay, { passive: true });
        }

        function loadRecommendations() {
            const sideList = document.getElementById('recommendList');
            const recommends = allProducts.filter(p => p.isRecommend === true);
            if (recommends.length === 0) {
                document.getElementById('recommendZone').style.display = 'none';
                document.getElementById('mobileRecommend').style.display = 'none';
                return;
            }
            document.getElementById('recommendZone').style.display = 'block';
            let sideHtml = '';
            recommends.forEach(function(rec) {
                let detailUrl, targetAttr = '';
                if (rec.detailPageType === "自定义模板" && rec.detailPagePath) {
                    detailUrl = rec.detailPagePath;
                    targetAttr = ' target="_blank"';
                } else {
                    detailUrl = 'tail.html?id=' + rec.id;
                }
                sideHtml += '<li class="recommend-item">' +
                    '<span>' + rec.name + '</span>' +
                    '<a href="' + detailUrl + '"' + targetAttr + '>查看</a>' +
                    '</li>';
            });
            sideList.innerHTML = sideHtml;

            const mobileList = document.getElementById('mobileRecommendList');
            if (mobileList) mobileList.innerHTML = sideHtml;
        }

        function scrollToControlBar() {
            const controlBar = document.getElementById('controlBar');
            if (!controlBar) return;
            const rect = controlBar.getBoundingClientRect();
            const topOffset = 70;
            const targetY = rect.top + window.pageYOffset - topOffset;
            window.scrollTo({ top: targetY, behavior: 'smooth' });
        }

        function getFilteredCount() {
            let filtered = allProducts.slice();
            if (currentCategory !== "全部资源") {
                filtered = filtered.filter(function(p) { return p.category === currentCategory; });
            }
            if (searchKeyword !== "") {
                filtered = filtered.filter(function(p) { return p.name.toLowerCase().includes(searchKeyword); });
            }
            return filtered.length;
        }

        function renderProductGrid() {
            let filtered = allProducts.slice();
            if (currentCategory !== "全部资源") {
                filtered = filtered.filter(function(p) { return p.category === currentCategory; });
            }
            if (searchKeyword !== "") {
                filtered = filtered.filter(function(p) { return p.name.toLowerCase().includes(searchKeyword); });
            }

            const total = filtered.length;
            const totalPages = Math.ceil(total / PAGE_SIZE);
            if (currentPage >= totalPages && totalPages > 0) { currentPage = totalPages - 1; }
            if (currentPage < 0) currentPage = 0;

            const start = currentPage * PAGE_SIZE;
            const end = Math.min(start + PAGE_SIZE, total);
            const pageItems = filtered.slice(start, end);

            const grid = document.getElementById('productGrid');
            if (pageItems.length === 0) {
                grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;color:#94A3B8;padding:40px;">💡 未检索到符合条件的资源。</div>';
                updatePagination(total, totalPages);
                updateUrlParams();
                return;
            }

            let html = '';
            pageItems.forEach(function(product) {
                const globalIndex = filtered.indexOf(product);
                const zodiac = ZODIAC[globalIndex % 12];
                const logo = product.mainImage && product.mainImage.trim() !== '' ? product.mainImage :
                    'logo/default.png';
                let detailUrl, targetAttr = '';
                if (product.detailPageType === "自定义模板" && product.detailPagePath) {
                    detailUrl = product.detailPagePath;
                    targetAttr = ' target="_blank"';
                } else {
                    detailUrl = 'tail.html?id=' + product.id;
                }
                html += '<div class="item">' +
                    '<div class="item-image-wrapper">' +
                    '<img src="' + logo + '" alt="' + product.name + '" class="item-image" onerror="this.onerror=null; this.src=\'logo/default.png\';">' +
                    '</div>' +
                    '<div class="item-content">' +
                    '<div class="item-title-row">' +
                    '<span class="item-zodiac">' + zodiac + '</span>' +
                    '<span class="item-title" title="' + product.name + '">' + product.name + '</span>' +
                    '</div>' +
                    '<a href="' + detailUrl + '"' + targetAttr + ' class="item-link">查看详情</a>' +
                    '</div>' +
                    '</div>';
            });
            grid.innerHTML = html;
            updatePagination(total, totalPages);
            updateUrlParams();
        }

        function updatePagination(total, totalPages) {
            const pageInfo = document.getElementById('pageInfo');
            const prevBtn = document.getElementById('prevPageBtn');
            const nextBtn = document.getElementById('nextPageBtn');
            if (total === 0) {
                pageInfo.textContent = '第 0 / 0 页';
                prevBtn.disabled = true;
                nextBtn.disabled = true;
                return;
            }
            const currentDisplay = currentPage + 1;
            pageInfo.textContent = '第 ' + currentDisplay + ' / ' + totalPages + ' 页';
            prevBtn.disabled = (currentPage === 0);
            nextBtn.disabled = (currentPage >= totalPages - 1);
            const jumpInput = document.getElementById('pageJumpInput');
            jumpInput.max = totalPages;
            jumpInput.placeholder = '1-' + totalPages;
        }

        function renderCategories() {
            const ul = document.getElementById('categoryUl');
            ul.innerHTML = '';
            categories.forEach(function(cat) {
                if (cat === "全部资源") return;
                const li = document.createElement('li');
                li.className = 'category-item' + (cat === currentCategory ? ' active' : '');
                li.textContent = cat;
                li.setAttribute('data-cat', cat);
                li.onclick = function() {
                    window.location.href = 'shopindex.html?category=' + encodeURIComponent(cat);
                };
                ul.appendChild(li);
            });
        }

        function updateCategoryUI(cat) {
            document.getElementById('currentCategoryTitle').innerText = cat;
            document.querySelectorAll('.category-item').forEach(function(item) {
                item.classList.toggle('active', item.getAttribute('data-cat') === cat);
            });
        }

        function loadFriendLinks() {
            const zone = document.getElementById('friendLinksZone');
            if (!zone) return;
            if (ALL_SOFTWARES.friendLinks && ALL_SOFTWARES.friendLinks.length > 0) {
                let linksHtml = '<span style="color:#64748b; margin-right:4px;">友情链接：</span>';
                ALL_SOFTWARES.friendLinks.forEach(function(link) {
                    if (link.siteName && link.jumpUrl && link.jumpUrl !== 'http://') {
                        linksHtml += '<a href="' + link.jumpUrl + '" target="_blank" class="friend-link-node">' +
                            link.siteName + '</a>';
                    }
                });
                if (linksHtml) {
                    zone.innerHTML = linksHtml;
                    zone.style.display = 'flex';
                } else {
                    zone.style.display = 'none';
                }
            } else {
                zone.style.display = 'none';
            }
        }
    </script>

</body>
</html>
