<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>畅享系列</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: #F4F7FA;
            color: #334155;
            line-height: 1.5;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        .header {
            background: linear-gradient(135deg, #4A90E2 0%, #5C9CE6 100%);
            color: #fff;
            padding: 60px 20px 50px;
            text-align: center;
            position: relative;
            overflow: hidden;
            border-bottom: none;
        }
        .header::before {
            content: '';
            position: absolute;
            top: -80px;
            right: -80px;
            width: 250px;
            height: 250px;
            background: rgba(255,255,255,0.08);
            border-radius: 50%;
            filter: blur(60px);
            pointer-events: none;
        }
        .header::after {
            content: '';
            position: absolute;
            bottom: -60px;
            left: -60px;
            width: 200px;
            height: 200px;
            background: rgba(255,255,255,0.06);
            border-radius: 50%;
            filter: blur(50px);
            pointer-events: none;
        }
        .header .tag {
            display: inline-block;
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(4px);
            padding: 4px 16px;
            border-radius: 20px;
            font-size: 0.8rem;
            letter-spacing: 1px;
            color: rgba(255,255,255,0.9);
            margin-bottom: 16px;
            border: 1px solid rgba(255,255,255,0.1);
            position: relative;
            z-index: 2;
        }
        .header h1 {
            color: #ffffff;
            margin: 0 0 8px 0;
            font-size: 2rem;
            letter-spacing: 3px;
            position: relative;
            z-index: 2;
        }
        .header p {
            color: rgba(255,255,255,0.85);
            margin: 0;
            font-size: 0.9rem;
            letter-spacing: 1px;
            position: relative;
            z-index: 2;
        }

        .main-container {
            max-width: 1140px;
            margin: 25px auto;
            padding: 0 20px;
            display: flex;
            gap: 24px;
            flex: 1;
            width: 100%;
        }
        .sidebar-wrapper {
            width: 230px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            flex-shrink: 0;
        }
        .sidebar {
            background: #fff;
            border-radius: 14px;
            padding: 14px;
            border: 1px solid #E6EFFB;
        }
        .sidebar-title {
            font-size: 0.8rem;
            font-weight: 700;
            color: #8896A8;
            padding: 4px 8px 10px;
            border-bottom: 1px solid #F0F4FA;
            margin-bottom: 10px;
            text-transform: uppercase;
        }
        .category-list { list-style: none; }
        .category-item {
            padding: 10px 14px;
            margin-bottom: 4px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            color: #606F7B;
            font-weight: 500;
            transition: 0.25s;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .category-item:hover { background-color: #F0F6FE; color: #4A90E2; }
        .category-item.active {
            background-color: #4A90E2;
            color: #fff;
            font-weight: 600;
            box-shadow: 0 4px 12px rgba(74,144,226,0.25);
        }

        /* ===== 公告栏 - 轮播改造 ===== */
        .sidebar-notice-panel {
            background: #fff;
            border-radius: 14px;
            padding: 16px;
            border: 1px solid #E6EFFB;
            position: relative;
        }
        .notice-sub-title {
            font-size: 0.82rem;
            font-weight: 700;
            color: #64748B;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        /* 轮播容器 */
        .notice-carousel {
            position: relative;
            overflow: hidden;
            min-height: 60px;
        }
        .notice-slide {
            display: none;
            animation: fadeSlide 0.5s ease forwards;
            font-size: 0.82rem;
            color: #4F5E74;
            line-height: 1.6;
            background: #F5F9FF;
            padding: 10px 14px;
            border-radius: 8px;
            border-left: 3px solid #4A90E2;
            word-break: break-word;
        }
        .notice-slide.active {
            display: block;
        }
        @keyframes fadeSlide {
            0% { opacity: 0; transform: translateY(6px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        /* 轮播控制条 */
        .notice-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-top: 10px;
            padding-top: 8px;
            border-top: 1px solid #F0F4FA;
        }
        .notice-arrow {
            background: none;
            border: none;
            font-size: 1.1rem;
            color: #94A3B8;
            cursor: pointer;
            padding: 0 4px;
            transition: color 0.2s;
            line-height: 1;
        }
        .notice-arrow:hover {
            color: #4A90E2;
        }
        .notice-dots {
            display: flex;
            gap: 6px;
            align-items: center;
        }
        .notice-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #DCE4EC;
            border: none;
            padding: 0;
            cursor: pointer;
            transition: background 0.2s, transform 0.2s;
        }
        .notice-dot.active {
            background: #4A90E2;
            transform: scale(1.2);
        }
        .notice-dot:hover {
            background: #A0B8D0;
        }
        /* 当只有一条公告时，隐藏控制条 */
        .notice-controls.hidden {
            display: none;
        }

        /* 移动端适配 */
        @media (max-width: 768px) {
            .notice-carousel {
                min-height: 50px;
            }
            .notice-slide {
                font-size: 0.78rem;
                padding: 8px 12px;
            }
            .notice-controls {
                gap: 8px;
                margin-top: 6px;
                padding-top: 6px;
            }
            .notice-arrow {
                font-size: 1rem;
            }
            .notice-dot {
                width: 7px;
                height: 7px;
            }
        }
        @media (max-width: 480px) {
            .notice-slide {
                font-size: 0.75rem;
                padding: 6px 10px;
            }
        }

        /* ===== 其他样式（原样保留） ===== */
        .recommend-zone {
            background: #fff;
            border-radius: 14px;
            padding: 16px;
            border: 1px solid #E6EFFB;
            margin-top: 0;
        }
        .recommend-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .recommend-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.82rem;
            color: #606F7B;
            padding: 8px 10px;
            background: #F8FAFD;
            border-radius: 8px;
            border: 1px solid #EDF3FA;
            transition: 0.2s;
        }
        .recommend-item:hover { border-color: #D6E4F7; background: #F1F6FC; }
        .recommend-item a {
            color: #4A90E2;
            text-decoration: none;
            font-weight: 600;
        }
        .content-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 16px;
            min-width: 0;
        }
        .control-bar {
            background: #fff;
            padding: 12px 20px;
            border-radius: 14px;
            border: 1px solid #E6EFFB;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            scroll-margin-top: 20px;
        }
        .control-bar h2 {
            font-size: 1rem;
            color: #2C3E50;
            font-weight: 700;
        }
        .control-bar h2 span { color: #4A90E2; }
        .search-box-wrapper {
            position: relative;
            flex-grow: 1;
            max-width: 300px;
        }
        .search-input {
            width: 100%;
            padding: 8px 12px 8px 32px;
            font-size: 0.85rem;
            background: #F8FAFD;
            border: 1px solid #E2EAF4;
            border-radius: 8px;
            outline: none;
        }
        .search-input:focus {
            background: #fff;
            border-color: #4A90E2;
        }
        .search-icon {
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            width: 14px;
            height: 14px;
            color: #A0AEC0;
        }
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 16px;
        }
        .item {
            background: #fff;
            border-radius: 12px;
            overflow: hidden;
            transition: transform 0.25s, box-shadow 0.25s;
            border: 1px solid #E6EFFB;
            display: flex;
            flex-direction: column;
        }
        .item:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(74,144,226,0.1);
        }
        .item-image-wrapper {
            width: 100%;
            aspect-ratio: 1 / 1;
            background: #F8FAFD;
            display: flex;
            align-items: center;
            justify-content: center;
            border-bottom: 1px solid #F0F4FA;
            overflow: hidden;
        }
        .item-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .item-content {
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .item-title-row {
            display: flex;
            align-items: baseline;
            gap: 4px;
            min-height: 2.4em;
        }
        .item-zodiac {
            font-size: 0.75rem;
            color: #8A9AA8;
            opacity: 0.7;
            line-height: 1;
            position: relative;
            top: -2px;
            flex-shrink: 0;
        }
        .item-title {
            font-size: 0.85rem;
            font-weight: 600;
            color: #334155;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            line-height: 1.4;
        }
        .item-link {
            display: block;
            text-align: center;
            background-color: #4A90E2;
            color: #fff;
            text-decoration: none;
            padding: 6px 0;
            border-radius: 8px;
            font-size: 0.75rem;
            font-weight: 600;
            transition: 0.2s;
            margin-top: 4px;
        }
        .item-link:hover { background-color: #357ABD; }

        /* ===== 分页控件 ===== */
        .pagination-bar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 20px 40px;
            background: #fff;
            padding: 14px 30px;
            border-radius: 14px;
            border: 1px solid #E6EFFB;
            margin-top: 8px;
        }
        .pagination-group {
            display: flex;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
        }
        .pagination-group--jump {
            gap: 8px;
        }
        .page-btn {
            background: #F8FAFD;
            border: 1px solid #E2EAF4;
            border-radius: 8px;
            padding: 6px 18px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: 0.2s;
            color: #334155;
            font-weight: 500;
        }
        .page-btn:hover:not(:disabled) {
            background: #EFF6FF;
            border-color: #4A90E2;
            color: #4A90E2;
        }
        .page-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            pointer-events: none;
        }
        #pageInfo {
            font-weight: 600;
            color: #334155;
            font-size: 0.95rem;
            white-space: nowrap;
            padding: 0 4px;
        }
        .page-jump {
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .page-jump span {
            font-size: 0.85rem;
            color: #64748B;
        }
        .page-jump input {
            width: 56px;
            padding: 4px 6px;
            border: 1px solid #E2EAF4;
            border-radius: 6px;
            text-align: center;
            font-size: 0.85rem;
            background: #F8FAFD;
            outline: none;
        }
        .page-jump input:focus {
            border-color: #4A90E2;
            background: #fff;
        }
        .page-jump button {
            padding: 4px 14px;
            background: #4A90E2;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: 0.2s;
        }
        .page-jump button:hover {
            background: #357ABD;
        }

        /* ===== 骨架屏 ===== */
        .skeleton-card {
            background: #fff;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #E6EFFB;
            display: flex;
            flex-direction: column;
        }
        .skeleton-img {
            width: 100%;
            aspect-ratio: 1 / 1;
            background: linear-gradient(90deg, #EDF3FA 25%, #F8FAFD 50%, #EDF3FA 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }
        .skeleton-body {
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .skeleton-line {
            height: 14px;
            border-radius: 6px;
            background: linear-gradient(90deg, #EDF3FA 25%, #F8FAFD 50%, #EDF3FA 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }
        .skeleton-line--short { width: 60%; }
        .skeleton-line--btn {
            height: 28px;
            border-radius: 8px;
            margin-top: 4px;
        }
        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        /* 移动端适配 */
        @media (max-width: 768px) {
            .grid-container {
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
                gap: 12px;
            }
            .header { padding: 40px 20px 35px; }
            .header h1 { font-size: 1.6rem; }
            .main-container { flex-direction: column; }
            .sidebar-wrapper { width: 100%; }
            .category-list {
                display: flex;
                overflow-x: auto;
                gap: 6px;
            }
            .category-list::-webkit-scrollbar { display: none; }
            .category-item {
                flex-shrink: 0;
                margin-bottom: 0;
                background: #EDF3FA;
                color: #5C6E80;
                border-radius: 6px;
            }
            .control-bar { flex-direction: column; align-items: flex-start; gap: 12px; }
            .search-box-wrapper { width: 100%; max-width: 100%; }
            .recommend-list {
                display: flex;
                flex-wrap: nowrap;
                overflow-x: auto;
                gap: 8px;
            }
            .recommend-item {
                white-space: nowrap;
                flex-shrink: 0;
            }
            .recommend-list::-webkit-scrollbar { display: none; }
            .recommend-list { scrollbar-width: none; -ms-overflow-style: none; }
            .pagination-bar {
                gap: 14px 20px;
                padding: 12px 16px;
            }
            .pagination-group {
                gap: 8px;
            }
            .page-btn {
                padding: 4px 12px;
                font-size: 0.8rem;
            }
            .page-jump input {
                width: 48px;
            }
        }
        @media (max-width: 480px) {
            .grid-container {
                grid-template-columns: repeat(2, 1fr);
                gap: 8px;
            }
            .pagination-bar {
                flex-direction: column;
                align-items: stretch;
                gap: 12px;
                padding: 12px;
            }
            .pagination-group {
                justify-content: center;
            }
            .pagination-group--jump {
                justify-content: center;
            }
        }

        .site-footer {
            background: #fff;
            border-top: 1px solid #E6EFFB;
            padding: 24px 0 20px;
            margin-top: 40px;
            width: 100%;
            text-align: center;
        }
        .footer-inner {
            max-width: 1140px;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }
        .friend-links-zone {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            padding-bottom: 12px;
            border-bottom: 1px dashed #E2EAF4;
            width: 100%;
            font-size: 0.82rem;
            color: #606F7B;
        }
        .friend-link-node {
            color: #606F7B;
            text-decoration: none;
            transition: 0.2s;
        }
        .friend-link-node:hover { color: #4A90E2; }
        .disclaimer-text {
            font-size: 0.75rem;
            color: #94A3B8;
            line-height: 1.6;
            max-width: 800px;
            text-align: center;
        }
        .copyright-text {
            font-size: 0.8rem;
            font-weight: 600;
            color: #64748B;
            padding-top: 8px;
        }
    </style>
    <script src="softwares.js"></script>
</head>
<body>
    <div class="header">
        <span class="tag">✦ 资源大厅</span>
        <h1>畅享创意工坊</h1>
        <p>欢迎畅游工坊中心</p>
    </div>

    <div class="main-container">
        <div class="sidebar-wrapper">
            <div class="sidebar">
                <div class="sidebar-title">📂 资源类别架构</div>
                <ul class="category-list" id="categoryUl"></ul>
            </div>
            <!-- ===== 公告栏（轮播改造） ===== -->
            <div class="sidebar-notice-panel" id="noticePanel">
                <div class="notice-sub-title">📢 工坊动态公告</div>
                <div class="notice-carousel" id="noticeCarousel">
                    <!-- 由 JS 动态填充 .notice-slide -->
                </div>
                <div class="notice-controls" id="noticeControls">
                    <button class="notice-arrow" id="noticePrev">◀</button>
                    <span class="notice-dots" id="noticeDots"></span>
                    <button class="notice-arrow" id="noticeNext">▶</button>
                </div>
            </div>
            <!-- ===== 公告栏结束 ===== -->
            <div id="recommendZone" class="recommend-zone">
                <div class="notice-sub-title">⭐ 精品推荐</div>
                <ul id="recommendList" class="recommend-list"></ul>
            </div>
        </div>

        <div class="content-panel">
            <div class="control-bar" id="controlBar">
                <h2>当前视图：<span id="currentCategoryTitle">🏠 全部资源</span></h2>
                <div class="search-box-wrapper">
                    <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                    <input type="text" id="searchInput" class="search-input" placeholder="键入关键字实时检索资源...">
                </div>
            </div>
            <!-- 网格容器 -->
            <div class="grid-container" id="productGrid">
                <!-- 骨架屏 -->
                <div class="skeleton-card"><div class="skeleton-img"></div><div class="skeleton-body"><div class="skeleton-line"></div><div class="skeleton-line skeleton-line--short"></div><div class="skeleton-line skeleton-line--btn"></div></div></div>
                <div class="skeleton-card"><div class="skeleton-img"></div><div class="skeleton-body"><div class="skeleton-line"></div><div class="skeleton-line skeleton-line--short"></div><div class="skeleton-line skeleton-line--btn"></div></div></div>
                <div class="skeleton-card"><div class="skeleton-img"></div><div class="skeleton-body"><div class="skeleton-line"></div><div class="skeleton-line skeleton-line--short"></div><div class="skeleton-line skeleton-line--btn"></div></div></div>
                <div class="skeleton-card"><div class="skeleton-img"></div><div class="skeleton-body"><div class="skeleton-line"></div><div class="skeleton-line skeleton-line--short"></div><div class="skeleton-line skeleton-line--btn"></div></div></div>
                <div class="skeleton-card"><div class="skeleton-img"></div><div class="skeleton-body"><div class="skeleton-line"></div><div class="skeleton-line skeleton-line--short"></div><div class="skeleton-line skeleton-line--btn"></div></div></div>
                <div class="skeleton-card"><div class="skeleton-img"></div><div class="skeleton-body"><div class="skeleton-line"></div><div class="skeleton-line skeleton-line--short"></div><div class="skeleton-line skeleton-line--btn"></div></div></div>
                <div class="skeleton-card"><div class="skeleton-img"></div><div class="skeleton-body"><div class="skeleton-line"></div><div class="skeleton-line skeleton-line--short"></div><div class="skeleton-line skeleton-line--btn"></div></div></div>
                <div class="skeleton-card"><div class="skeleton-img"></div><div class="skeleton-body"><div class="skeleton-line"></div><div class="skeleton-line skeleton-line--short"></div><div class="skeleton-line skeleton-line--btn"></div></div></div>
            </div>
            <!-- 分页控件 -->
            <div class="pagination-bar" id="paginationBar">
                <div class="pagination-group">
                    <button class="page-btn" id="prevPageBtn">◀ 上一页</button>
                    <span id="pageInfo">第 1 / 1 页</span>
                    <button class="page-btn" id="nextPageBtn">下一页 ▶</button>
                </div>
                <div class="pagination-group pagination-group--jump">
                    <span>跳转</span>
                    <input type="number" id="pageJumpInput" min="1" placeholder="页">
                    <button id="pageJumpBtn">GO</button>
                </div>
            </div>
        </div>
    </div>

    <footer class="site-footer">
        <div class="footer-inner">
            <div id="friendLinksZone" class="friend-links-zone"></div>
            <div class="disclaimer-text">
                <p>
                    📌 本站资源仅供技术交流与个人学习使用，请于下载后 24 小时内删除。<br>
                    若用于商业环境，请自行获取官方授权，由此产生的法律责任与本站无关。
                </p>
            </div>
            <div class="copyright-text">© 2026 畅享创意工坊. All Rights Reserved.</div>
        </div>
    </footer>

    <script>
        let allProducts = [];
        let categories = ["全部资源"];
        let currentCategory = "全部资源";
        let searchKeyword = "";
        const PAGE_SIZE = 12;
        let currentPage = 0;

        // 十二生肖（用于卡片标签），有没有人看到我~
        const ZODIAC = ['🐭', '🐮', '🐯', '🐰', '🐲', '🐍', '🐴', '🐏', '🐵', '🐔', '🐶', '🐷'];

        document.addEventListener('DOMContentLoaded', () => {
            if (typeof ALL_SOFTWARES === 'undefined' || !ALL_SOFTWARES.products) {
                document.getElementById('productGrid').innerHTML = '<div style="grid-column:1/-1;text-align:center;color:#EF4444;padding:40px;">⚠️ 数据加载失败，请检查 softwares.js 文件。</div>';
                return;
            }
            allProducts = ALL_SOFTWARES.products;

            if (ALL_SOFTWARES.categories && Array.isArray(ALL_SOFTWARES.categories) && ALL_SOFTWARES.categories.length > 0) {
                categories = ["全部资源", ...ALL_SOFTWARES.categories];
            } else {
                const catSet = new Set();
                allProducts.forEach(p => { if (p.category) catSet.add(p.category); });
                categories = ["全部资源", ...Array.from(catSet)];
            }

            const urlParams = new URLSearchParams(window.location.search);
            const categoryParam = urlParams.get('category');
            if (categoryParam && categories.includes(categoryParam)) {
                currentCategory = categoryParam;
            } else {
                currentCategory = "全部资源";
            }

            renderCategories();
            loadAnnouncements();     // 加载公告（轮播版）
            loadRecommendations();
            loadFriendLinks();
            updateCategoryUI(currentCategory);
            renderProductGrid();

            const searchInput = document.getElementById('searchInput');
            searchInput.addEventListener('input', (e) => {
                searchKeyword = e.target.value.trim().toLowerCase();
                currentPage = 0;
                renderProductGrid();
            });

            document.getElementById('prevPageBtn').addEventListener('click', () => {
                if (currentPage > 0) {
                    currentPage--;
                    renderProductGrid();
                    scrollToControlBar();
                }
            });
            document.getElementById('nextPageBtn').addEventListener('click', () => {
                const total = getFilteredCount();
                const totalPages = Math.ceil(total / PAGE_SIZE);
                if (currentPage < totalPages - 1) {
                    currentPage++;
                    renderProductGrid();
                    scrollToControlBar();
                }
            });
            document.getElementById('pageJumpBtn').addEventListener('click', () => {
                const input = document.getElementById('pageJumpInput');
                let val = parseInt(input.value.trim(), 10);
                const total = getFilteredCount();
                const totalPages = Math.ceil(total / PAGE_SIZE);
                if (isNaN(val) || val < 1) val = 1;
                if (val > totalPages) val = totalPages;
                if (val >= 1 && val <= totalPages) {
                    currentPage = val - 1;
                    renderProductGrid();
                    scrollToControlBar();
                }
                input.value = '';
            });
            document.getElementById('pageJumpInput').addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    document.getElementById('pageJumpBtn').click();
                }
            });
        });

        function scrollToControlBar() {
            const controlBar = document.getElementById('controlBar');
            if (controlBar) {
                controlBar.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
        }

        function getFilteredCount() {
            let filtered = allProducts;
            if (currentCategory !== "全部资源") {
                filtered = filtered.filter(p => p.category === currentCategory);
            }
            if (searchKeyword !== "") {
                filtered = filtered.filter(p => p.name.toLowerCase().includes(searchKeyword));
            }
            return filtered.length;
        }

        function renderProductGrid() {
            let filtered = allProducts;
            if (currentCategory !== "全部资源") {
                filtered = filtered.filter(p => p.category === currentCategory);
            }
            if (searchKeyword !== "") {
                filtered = filtered.filter(p => p.name.toLowerCase().includes(searchKeyword));
            }

            const total = filtered.length;
            const totalPages = Math.ceil(total / PAGE_SIZE);
            if (currentPage >= totalPages && totalPages > 0) {
                currentPage = totalPages - 1;
            }
            if (currentPage < 0) currentPage = 0;

            const start = currentPage * PAGE_SIZE;
            const end = Math.min(start + PAGE_SIZE, total);
            const pageItems = filtered.slice(start, end);

            const grid = document.getElementById('productGrid');
            if (pageItems.length === 0) {
                grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;color:#94A3B8;padding:60px;">💡 未检索到符合条件的资源。</div>';
                updatePagination(total, totalPages);
                return;
            }

            let html = '';
            pageItems.forEach((product) => {
                const globalIndex = filtered.indexOf(product);
                const zodiac = ZODIAC[globalIndex % 12];
                const logo = product.mainImage && product.mainImage.trim() !== '' ? product.mainImage : 'logo/default.png';
                html += `
                    <div class="item">
                        <div class="item-image-wrapper">
                            <img src="${logo}" alt="${product.name}" class="item-image" onerror="this.onerror=null; this.src='logo/default.png';">
                        </div>
                        <div class="item-content">
                            <div class="item-title-row">
                                <span class="item-zodiac">${zodiac}</span>
                                <span class="item-title" title="${product.name}">${product.name}</span>
                            </div>
                            <a href="tail.html?id=${product.id}" class="item-link">查看详情</a>
                        </div>
                    </div>
                `;
            });
            grid.innerHTML = html;
            updatePagination(total, totalPages);
        }

        function updatePagination(total, totalPages) {
            const pageInfo = document.getElementById('pageInfo');
            const prevBtn = document.getElementById('prevPageBtn');
            const nextBtn = document.getElementById('nextPageBtn');

            if (total === 0) {
                pageInfo.textContent = '第 0 / 0 页';
                prevBtn.disabled = true;
                nextBtn.disabled = true;
                return;
            }

            const currentDisplay = currentPage + 1;
            pageInfo.textContent = `第 ${currentDisplay} / ${totalPages} 页`;
            prevBtn.disabled = (currentPage === 0);
            nextBtn.disabled = (currentPage >= totalPages - 1);

            const jumpInput = document.getElementById('pageJumpInput');
            jumpInput.max = totalPages;
            jumpInput.placeholder = `1-${totalPages}`;
        }

        // ----- 原有函数 -----
        function renderCategories() {
            const ul = document.getElementById('categoryUl');
            ul.innerHTML = '';
            categories.forEach(cat => {
                const li = document.createElement('li');
                li.className = 'category-item' + (cat === currentCategory ? ' active' : '');
                li.textContent = cat;
                li.setAttribute('data-cat', cat);
                li.onclick = () => filterCategory(cat);
                ul.appendChild(li);
            });
        }

        function updateCategoryUI(cat) {
            document.getElementById('currentCategoryTitle').innerText = cat;
            document.querySelectorAll('.category-item').forEach(item => {
                if (item.getAttribute('data-cat') === cat) {
                    item.classList.add('active');
                } else {
                    item.classList.remove('active');
                }
            });
        }

        function filterCategory(cat) {
            currentCategory = cat;
            currentPage = 0;
            updateCategoryUI(cat);
            renderProductGrid();
            scrollToControlBar();
        }

        // ============================================================
        // ★★★ 公告轮播逻辑（改造） ★★★
        // ============================================================
        let noticeList = [];
        let currentNoticeIndex = 0;
        let noticeTimer = null;
        const INTERVAL = 5000; // 5秒切换

        function loadAnnouncements() {
            const carousel = document.getElementById('noticeCarousel');
            const controls = document.getElementById('noticeControls');
            const dotsContainer = document.getElementById('noticeDots');
            const prevBtn = document.getElementById('noticePrev');
            const nextBtn = document.getElementById('noticeNext');

            // 读取公告数据
            if (typeof ALL_SOFTWARES !== 'undefined' && ALL_SOFTWARES.announcements && ALL_SOFTWARES.announcements.length > 0) {
                noticeList = ALL_SOFTWARES.announcements.filter(ann => ann.title && ann.title.trim() !== '');
            } else {
                noticeList = [];
            }

            // 清空容器
            carousel.innerHTML = '';
            dotsContainer.innerHTML = '';

            // 如果没有公告，隐藏整个面板
            if (noticeList.length === 0) {
                document.getElementById('noticePanel').style.display = 'none';
                return;
            }

            // 创建幻灯片
            noticeList.forEach((ann, idx) => {
                const slide = document.createElement('div');
                slide.className = 'notice-slide' + (idx === 0 ? ' active' : '');
                slide.textContent = ann.title; // 直接显示标题，保留原有风格
                slide.dataset.index = idx;
                carousel.appendChild(slide);

                // 创建指示点
                const dot = document.createElement('button');
                dot.className = 'notice-dot' + (idx === 0 ? ' active' : '');
                dot.dataset.index = idx;
                dot.setAttribute('aria-label', '切换到公告 ' + (idx + 1));
                dotsContainer.appendChild(dot);
            });

            // 如果只有一条公告，隐藏控制条
            if (noticeList.length <= 1) {
                controls.classList.add('hidden');
            } else {
                controls.classList.remove('hidden');
            }

            // 绑定事件
            prevBtn.addEventListener('click', () => goToNotice(currentNoticeIndex - 1));
            nextBtn.addEventListener('click', () => goToNotice(currentNoticeIndex + 1));
            dotsContainer.querySelectorAll('.notice-dot').forEach(dot => {
                dot.addEventListener('click', function() {
                    const idx = parseInt(this.dataset.index, 10);
                    if (!isNaN(idx) && idx !== currentNoticeIndex) {
                        goToNotice(idx);
                    }
                });
            });

            // 启动轮播
            startAutoPlay();

            // 鼠标悬停暂停
            const panel = document.getElementById('noticePanel');
            panel.addEventListener('mouseenter', pauseAutoPlay);
            panel.addEventListener('mouseleave', startAutoPlay);
            // 移动端触摸暂停
            panel.addEventListener('touchstart', pauseAutoPlay, { passive: true });
            panel.addEventListener('touchend', startAutoPlay, { passive: true });

            // 初始显示
            currentNoticeIndex = 0;
            updateNotice();
        }

        function goToNotice(index) {
            if (noticeList.length === 0) return;
            if (index < 0) index = noticeList.length - 1;
            if (index >= noticeList.length) index = 0;
            if (index === currentNoticeIndex) return;
            currentNoticeIndex = index;
            updateNotice();
            // 重置自动播放计时器
            resetAutoPlay();
        }

        function updateNotice() {
            const slides = document.querySelectorAll('.notice-slide');
            const dots = document.querySelectorAll('.notice-dot');
            slides.forEach((s, i) => {
                s.classList.toggle('active', i === currentNoticeIndex);
            });
            dots.forEach((d, i) => {
                d.classList.toggle('active', i === currentNoticeIndex);
            });
        }

        // 自动播放控制
        function startAutoPlay() {
            if (noticeList.length <= 1) return;
            if (noticeTimer) clearInterval(noticeTimer);
            noticeTimer = setInterval(() => {
                goToNotice(currentNoticeIndex + 1);
            }, INTERVAL);
        }

        function pauseAutoPlay() {
            if (noticeTimer) {
                clearInterval(noticeTimer);
                noticeTimer = null;
            }
        }

        function resetAutoPlay() {
            pauseAutoPlay();
            startAutoPlay();
        }

        // ============================================================
        // 推荐 & 友情链接（原样保留）
        // ============================================================
        function loadRecommendations() {
            const recZone = document.getElementById('recommendZone');
            const recList = document.getElementById('recommendList');
            if (!recZone || !recList) return;
            const recommends = allProducts.filter(p => p.isRecommend === true);
            if (recommends.length === 0) {
                recZone.style.display = 'none';
                return;
            }
            let html = '';
            recommends.forEach(rec => {
                html += `
                    <li class="recommend-item">
                        <span>${rec.name}</span>
                        <a href="tail.html?id=${rec.id}">查看详情</a>
                    </li>
                `;
            });
            recList.innerHTML = html;
            recZone.style.display = 'block';
        }

        function loadFriendLinks() {
            const zone = document.getElementById('friendLinksZone');
            if (!zone) return;
            if (ALL_SOFTWARES.friendLinks && ALL_SOFTWARES.friendLinks.length > 0) {
                let linksHtml = '';
                ALL_SOFTWARES.friendLinks.forEach(link => {
                    if (link.siteName && link.jumpUrl && link.jumpUrl !== 'http://') {
                        linksHtml += `<a href="${link.jumpUrl}" target="_blank" class="friend-link-node">${link.siteName}</a>`;
                    }
                });
                if (linksHtml) {
                    zone.innerHTML = '<span style="color:#606F7B; margin-right:4px;">友情链接：</span>' + linksHtml;
                    zone.style.display = 'flex';
                } else {
                    zone.style.display = 'none';
                }
            } else {
                zone.style.display = 'none';
            }
        }
    </script>
</body>
</html>
